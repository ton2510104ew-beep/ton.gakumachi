<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>福井県の企業所在地マップ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body {
      max-width: 900px;
      margin: 32px auto;
      padding: 0 16px;
      color: #234c54;
      font-family: "Yu Gothic", "Hiragino Sans", sans-serif;
      line-height: 1.6;
    }
    h1 { color: #1a4d5a; }
    label { display: block; margin-bottom: 6px; font-weight: 700; }
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #8cc9c8;
      border-radius: 8px;
      font-size: 16px;
    }
    #company-info { margin: 16px 0 8px; }
    #message { min-height: 1.6em; color: #527477; }
    #map { width: 100%; height: 480px; border-radius: 12px; }
  </style>
</head>
<body>
  <h1>福井県の企業所在地マップ</h1>
  <p>企業を選ぶと、住所をもとに地図上に場所を表示します。</p>

  <label for="company-select">企業を選択</label>
  <select id="company-select"></select>
  <p id="company-info"></p>
  <p id="message" role="status" aria-live="polite">住所を調べています…</p>
  <div id="map" aria-label="企業所在地の地図"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // 企業データは、サイトの企業一覧に掲載している情報を使用しています。
    const companies = [
      { name: "jig.jp", address: "福井県鯖江市" },
      { name: "福井銀行", address: "福井県福井市" },
      { name: "株式会社PLANT", address: "〒919-0521 福井県坂井市坂井町下新庄15号8番地の1" },
      { name: "清川メッキ工業株式会社", address: "福井県福井市和田中1-414" },
      { name: "勝山ファーマ株式会社", address: "福井県勝山市猪野口37字2番1号" },
      { name: "株式会社永和システムマネジメント", address: "福井県福井市問屋町3-111" },
      { name: "有限会社増米商店", address: "福井県敦賀市松島町18-10" }
    ];

    const select = document.getElementById("company-select");
    const companyInfo = document.getElementById("company-info");
    const message = document.getElementById("message");
    const mapElement = document.getElementById("map");

    for (const [index, company] of companies.entries()) {
      const option = document.createElement("option");
      option.value = String(index);
      option.textContent = company.name;
      select.appendChild(option);
    }

    let map;
    let marker;
    let requestNumber = 0;

    async function showCompanyMap(company) {
      const thisRequest = ++requestNumber;
      companyInfo.textContent = `所在地：${company.address}`;
      message.textContent = "住所を調べています…";

      try {
        const { normalize } = await import(
          "https://esm.sh/@geolonia/normalize-japanese-addresses@3.1.3"
        );
        const result = await normalize(company.address, { level: 8 });
        if (thisRequest !== requestNumber) return;

        const point = result && result.point;
        if (!point || !Number.isFinite(point.lat) || !Number.isFinite(point.lng) || point.level < 3) {
          message.textContent = "この住所の位置を調べられませんでした。住所を確認してください。";
          return;
        }

        const position = [point.lat, point.lng];
        if (!map) {
          map = L.map(mapElement).setView(position, 16);
          L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png", {
            maxZoom: 18,
            attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html">地理院タイル</a>'
          }).addTo(map);
        } else {
          map.setView(position, Math.max(map.getZoom(), 14));
        }

        if (marker) marker.remove();
        marker = L.marker(position).addTo(map);
        const popup = document.createElement("span");
        popup.textContent = company.name;
        marker.bindPopup(popup).openPopup();

        message.textContent = point.level === 8
          ? "住所から調べた位置です。正確な場所は企業にご確認ください。"
          : "市区町村などの代表地点です。正確な場所とは異なる場合があります。";
      } catch (error) {
        if (thisRequest !== requestNumber) return;
        message.textContent = "地図を表示できませんでした。通信環境を確認してください。";
        console.error(error);
      }
    }

    select.addEventListener("change", () => {
      showCompanyMap(companies[Number(select.value)]);
    });

    showCompanyMap(companies[0]);
  </script>
</body>
</html>

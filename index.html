<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d9f6f2">
  <title>福井で見つける企業・仕事 | ガクマチ</title>
  <style>
    :root { color-scheme:light; --dark:#164b59; --text:#244e57; --muted:#648187; --primary:#168f91; --line:rgba(91,187,184,.28); --glass:rgba(255,255,255,.62); }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { min-height:100vh; margin:0; padding:34px 18px 56px; color:var(--text); font-family:"Yu Gothic","Hiragino Sans",sans-serif; line-height:1.75; background:radial-gradient(ellipse at 8% 8%,rgba(255,255,255,.95),transparent 24%),radial-gradient(ellipse at 92% 20%,rgba(145,218,220,.35),transparent 29%),linear-gradient(160deg,#edfafa 0%,#d8f3f1 58%,#c9ebe6 100%); }
    body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.38; background-image:radial-gradient(circle at 20% 30%,rgba(255,255,255,.9) 0 1px,transparent 2px),radial-gradient(circle at 75% 65%,rgba(87,172,171,.22) 0 1px,transparent 2px); background-size:38px 38px,47px 47px; }
    main { max-width:1050px; margin:auto; }
    section { position:relative; isolation:isolate; overflow:hidden; padding:30px; margin-bottom:26px; border:1px solid rgba(255,255,255,.92); border-radius:32px; background:var(--glass); box-shadow:0 18px 45px rgba(55,137,139,.12),inset 0 1px 0 rgba(255,255,255,.9); backdrop-filter:blur(14px); }
    section::before { content:""; position:absolute; z-index:-1; top:-90px; right:-60px; width:210px; height:210px; border:1px solid rgba(255,255,255,.65); border-radius:50%; background:radial-gradient(circle at 55% 55%,rgba(255,255,255,.72),rgba(118,204,199,.12)); }
    section>* { position:relative; }
    h1,h2,h3 { color:var(--dark); }
    h1 { margin:0 0 8px; font-size:clamp(29px,5vw,44px); line-height:1.35; }
    h2 { margin-top:0; }
    .muted,.map-message,.notice { color:var(--muted); }
    .filters { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; align-items:start; }
    .search-filter-group { display:grid; gap:12px; min-width:0; }
    label { display:grid; gap:7px; }
    input,select { width:100%; min-width:0; padding:13px 15px; border:1px solid rgba(93,179,177,.4); border-radius:16px; background:rgba(255,255,255,.82); color:var(--text); font:inherit; box-shadow:inset 0 1px 0 white; }
    input::placeholder { color:#87a4a6; }
    :focus-visible { outline:3px solid rgba(22,143,145,.55); outline-offset:3px; }
    .filter-group { display:grid; gap:7px; }
    .filter-label { margin:0; color:var(--dark); font-size:14px; font-weight:700; }
    .filter-buttons { display:flex; flex-wrap:wrap; gap:8px; }
    .filter-button { padding:8px 13px; border:1px solid rgba(42,138,138,.3); border-radius:999px; color:var(--dark); background:rgba(255,255,255,.85); font:inherit; font-size:13px; box-shadow:0 3px 9px rgba(43,127,127,.08); }
    .filter-button[aria-pressed="true"] { border-color:transparent; color:white; background:linear-gradient(135deg,#6acfc9,#2a8a8a); }
    button { position:relative; overflow:hidden; padding:10px 17px; border:1px solid rgba(255,255,255,.55); border-radius:999px; color:white; background:linear-gradient(135deg,#73d9d0,#239d9c 72%,#16858d); font:inherit; font-weight:700; cursor:pointer; box-shadow:0 8px 18px rgba(47,146,145,.18); transition:transform .18s,filter .18s,box-shadow .18s; -webkit-tap-highlight-color:transparent; }
    button:hover { filter:brightness(1.05); transform:translateY(-1px); }
    button:active { transform:scale(.96); box-shadow:0 3px 10px rgba(47,146,145,.16); }
    button:disabled { opacity:.6; cursor:not-allowed; }
    .company-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:15px; margin-top:16px; }
    .company-card { position:relative; min-width:0; padding:19px; border:1px solid rgba(255,255,255,.9); border-radius:24px; background:linear-gradient(145deg,rgba(255,255,255,.88),rgba(221,248,244,.76)); box-shadow:0 12px 24px rgba(72,151,151,.1); cursor:pointer; transition:transform .2s,box-shadow .2s,background .35s; overflow:hidden; }
    .company-card::after { content:""; position:absolute; inset:-30%; border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.55),transparent 58%); transform:scale(0); opacity:0; pointer-events:none; }
    .company-card:hover { transform:translateY(-3px); box-shadow:0 16px 30px rgba(72,151,151,.16); }
    .company-card:active { transform:scale(.985); }
    .company-card h3 { margin:0 0 5px; }
    .company-card p { margin:5px 0; overflow-wrap:anywhere; color:var(--muted); font-size:14px; }
    .company-map { margin-top:16px; padding-top:12px; border-top:1px solid var(--line); }
    .company-map h4 { margin:0; color:var(--dark); }
    .company-map iframe { display:block; width:100%; height:300px; margin-top:10px; border:1px solid var(--line); border-radius:18px; background:#e8f3f2; }
    .map-link { display:inline-block; margin-top:8px; color:var(--primary); font-weight:700; }
    .notice { font-size:12px; }
    .career-chat { max-width:760px; margin:16px auto 0; padding:19px; border:1px solid rgba(255,255,255,.94); border-radius:26px; background:linear-gradient(145deg,rgba(255,255,255,.7),rgba(223,248,244,.64)); }
    .chat-messages { display:grid; gap:12px; max-height:360px; overflow-y:auto; padding:5px; }
    .chat-message { max-width:88%; padding:11px 15px; border:1px solid rgba(255,255,255,.85); border-radius:18px; white-space:pre-wrap; overflow-wrap:anywhere; }
    .chat-message.assistant { justify-self:start; background:rgba(255,255,255,.8); }
    .chat-message.user { justify-self:end; color:white; background:linear-gradient(135deg,#53c4bd,#238f95); }
    .chat-choices { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
    .chat-choices button { color:var(--dark); background:linear-gradient(135deg,#f8fffe,#d6f1ec); }
    .chat-entry { display:flex; gap:8px; margin-top:14px; }
    .chat-entry input { flex:1; }
    .chat-results { margin-top:18px; padding-top:14px; border-top:1px solid var(--line); }
    .chat-results h3 { margin-top:0; }
    .chat-results li { margin:8px 0; }
    .chat-results a { color:var(--primary); font-weight:700; }
    .visually-hidden { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

    /* タップ時の水面エフェクト */
    .water-ripple { position:fixed; z-index:9999; width:18px; height:18px; margin:-9px 0 0 -9px; border:2px solid rgba(255,255,255,.92); border-radius:50%; pointer-events:none; box-shadow:0 0 0 3px rgba(98,196,194,.28),0 0 18px rgba(255,255,255,.75),inset 0 0 8px rgba(46,158,158,.24); animation:water-ripple .68s cubic-bezier(.16,.7,.28,1) forwards; }
    .water-ripple::before,.water-ripple::after { content:""; position:absolute; inset:-7px; border:1px solid rgba(173,238,233,.9); border-radius:50%; animation:water-ring .72s .05s ease-out forwards; }
    .water-ripple::after { inset:-14px; border-color:rgba(255,255,255,.65); animation-delay:.12s; }
    .water-drop { position:fixed; z-index:9998; width:5px; height:8px; margin:-4px 0 0 -2.5px; border-radius:50% 50% 60% 60%; pointer-events:none; background:radial-gradient(circle at 35% 25%,white 0 18%,rgba(105,203,199,.78) 36%,rgba(37,145,148,.42)); box-shadow:0 2px 5px rgba(45,139,141,.18); animation:water-drop .62s cubic-bezier(.2,.7,.35,1) forwards; }
    .water-press { animation:water-press .38s ease-out; }
    @keyframes water-ripple { 0% { transform:scale(.2); opacity:1; } 100% { transform:scale(7); opacity:0; } }
    @keyframes water-ring { 0% { transform:scale(.15); opacity:.9; } 100% { transform:scale(2.2); opacity:0; } }
    @keyframes water-drop { 0% { transform:translate(0,0) scale(.8); opacity:.9; } 100% { transform:translate(var(--dx),var(--dy)) scale(.15); opacity:0; } }
    @keyframes water-press { 0% { filter:brightness(1); } 35% { filter:brightness(1.12) saturate(.9); } 100% { filter:brightness(1); } }

    @media(max-width:600px) { body { padding:16px 10px 36px; } section { padding:21px 16px; border-radius:26px; } .company-grid { grid-template-columns:1fr; } .company-map iframe { height:260px; } .chat-entry { flex-direction:column; } }
    @media(prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } *,*::before,*::after { transition-duration:.01ms!important; } .water-ripple,.water-ripple::before,.water-ripple::after,.water-drop { animation-duration:.01ms!important; } }
  </style>
</head>
<body>
<main>
  <section><h1>福井で見つける企業・仕事</h1><p>福井県内の企業を検索できます。企業を選ぶと、所在地を地図上に表示します。</p></section>
  <section aria-labelledby="career-heading">
    <h2 id="career-heading">あなたに合う仕事を一緒に考えよう</h2><p class="muted">少しだけ話してくれたら、あなたの考え方に合いそうな仕事や企業を提案します。</p>
    <div class="career-chat">
      <div id="chat-messages" class="chat-messages" role="log" aria-live="polite"></div>
      <div id="chat-choices" class="chat-choices" aria-label="回答を選択"></div>
      <form id="chat-form" class="chat-entry"><label for="chat-input" class="visually-hidden">自由に入力</label><input id="chat-input" type="text" placeholder="自由に話してみてください"><button type="submit">送る</button></form>
      <div id="chat-results" class="chat-results" hidden></div><button id="chat-reset" type="button" hidden>もう一度相談する</button>
    </div><p class="notice">※回答をもとに、福井県の企業データから候補を簡単に絞り込みます。</p>
  </section>
  <section aria-labelledby="company-heading">
    <h2 id="company-heading">福井県の企業を探す</h2><p class="muted">企業名・住所・事業内容から検索し、業種や市町村で絞り込めます。</p>
    <div class="filters">
      <div class="search-filter-group">
        <label for="company-search">企業を検索<input id="company-search" type="search" placeholder="企業名・住所・事業内容" aria-label="企業名・住所・事業内容で検索"></label>
        <div class="filter-group"><p class="filter-label">業種で絞り込む</p><div id="industry-filter-buttons" class="filter-buttons" role="group" aria-label="業種で絞り込む"></div></div>
        <div class="filter-group"><p class="filter-label">市町村で絞り込む</p><div id="municipality-filter-buttons" class="filter-buttons" role="group" aria-label="福井県の市町村で絞り込む"></div></div>
      </div>
      <label for="company-select">地図に表示する企業<select id="company-select" aria-label="地図に表示する企業"></select></label>
    </div>
    <p id="company-count" role="status" aria-live="polite"></p><div id="company-results" class="company-grid"></div>
    <p class="notice">※住所が市町村までの登録の場合、その市町村で絞り込みます。地図はGoogleマップの住所検索結果を表示します。</p>
  </section>
</main>
<script src="./companies.js"></script>
<script>
'use strict';
const companyList=Array.isArray(companies)?companies:[];
const select=document.getElementById('company-select');
const search=document.getElementById('company-search');
const industryButtons=document.getElementById('industry-filter-buttons');
const municipalityButtons=document.getElementById('municipality-filter-buttons');
const resultElement=document.getElementById('company-results');
const countElement=document.getElementById('company-count');
let activeIndex=null,selectedIndustry='',selectedMunicipality='';

const chatMessages=document.getElementById('chat-messages'),chatChoices=document.getElementById('chat-choices'),chatForm=document.getElementById('chat-form'),chatInput=document.getElementById('chat-input'),chatResults=document.getElementById('chat-results'),chatReset=document.getElementById('chat-reset');
const careerQuestions=[
 {text:'まず、あなたが「楽しい」と感じる仕事のタイプを選んでください。',choices:['頭を使って考える仕事','手を動かして作る仕事','人と関わる仕事','仕事や生活を計画する仕事']},
 {text:'次に、こんなときにやる気が出ますか？',choices:['新しいアイデアを考えるとき','ものづくりをしているとき','人の役に立てているとき','予定を整理して進めるとき']},
 {text:'最後に、働くうえで大事にしたいことはどれですか？',choices:['安定した仕事','成長できる環境','自分の考えを活かせる','人間関係が良い','社会や地域に貢献できる']}
];
let careerAnswers=[],careerStep=0;
function addChatMessage(text,speaker){const message=document.createElement('div');message.className=`chat-message ${speaker}`;message.textContent=text;chatMessages.appendChild(message);chatMessages.scrollTop=chatMessages.scrollHeight;}
function showCareerQuestion(){if(careerStep>=careerQuestions.length)return showCareerRecommendations();const question=careerQuestions[careerStep];addChatMessage(question.text,'assistant');chatChoices.replaceChildren();question.choices.forEach(choice=>{const button=document.createElement('button');button.type='button';button.textContent=choice;button.addEventListener('click',()=>submitCareerAnswer(choice));chatChoices.appendChild(button);});}
function submitCareerAnswer(answer){const clean=String(answer||'').trim();if(!clean||careerStep>=careerQuestions.length)return;careerAnswers.push(clean);addChatMessage(clean,'user');careerStep++;chatChoices.replaceChildren();setTimeout(showCareerQuestion,180);}
function getCareerMatches(){const text=careerAnswers.join(' ').toLocaleLowerCase();const groups=[
 {words:['考える','アイデア','分析','情報','it','システム'],industries:['ソフトウェア・情報処理','IT・ロボット代筆サービス・通販','システム開発・情報サービス','情報通信・地域サービス']},
 {words:['作る','ものづくり','機械','技術','設計'],industries:['精密機器','鉱業・金属製品・鉄鋼','半導体・電子・電気機器','機械・製造業','建設・土木']},
 {words:['人','支える','医療','社会','地域','接する'],industries:['医療用機器・医療関連','福祉・介護','人材派遣・人材紹介','地域経済・企業支援','生活協同組合']},
 {words:['計画','安定','数字','金融','管理'],industries:['銀行','信用金庫・金融サービス','専門商社','物流・倉庫']},
 {words:['地域','社会','環境','自然','エネルギー','貢献'],industries:['環境・リサイクル','水処理・環境関連サービス','電力・ガス・エネルギー','建設・土木']},
 {words:['販売','食','接客','商売'],industries:['食品','流通・チェーンストア','専門店（食品関連）','通信販売・ネット販売']}
];const ranked=new Map();groups.forEach(({words,industries})=>{const points=words.reduce((sum,word)=>sum+(text.includes(word)?2:0),0);if(points)industries.forEach(industry=>ranked.set(industry,(ranked.get(industry)||0)+points));});return [...ranked.entries()].sort((a,b)=>b[1]-a[1]).slice(0,5).map(([industry])=>industry);}
function showCareerRecommendations(){chatChoices.replaceChildren();chatInput.disabled=true;chatForm.querySelector('button').disabled=true;addChatMessage('ありがとうございます。あなたに合いそうな分野と企業をまとめました。','assistant');const matches=getCareerMatches();const matching=companyList.filter(company=>matches.includes(company.info)).slice(0,6);chatResults.hidden=false;chatResults.replaceChildren();const title=document.createElement('h3');title.textContent='おすすめの企業候補';chatResults.appendChild(title);if(!matching.length){const p=document.createElement('p');p.textContent='まずは企業を探す欄で業種を絞り込んでみてください。';chatResults.appendChild(p);}else{const list=document.createElement('ul');matching.forEach(company=>{const li=document.createElement('li'),link=document.createElement('a');link.href=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(company.address||company.name)}`;link.target='_blank';link.rel='noopener';link.textContent=`${company.name}（${company.info||''}）`;li.appendChild(link);list.appendChild(li);});chatResults.appendChild(list);}chatReset.hidden=false;}
chatForm.addEventListener('submit',event=>{event.preventDefault();const text=chatInput.value.trim();if(text)submitCareerAnswer(text);chatInput.value='';});
chatReset.addEventListener('click',()=>{careerAnswers=[];careerStep=0;chatMessages.replaceChildren();chatResults.replaceChildren();chatResults.hidden=true;chatReset.hidden=true;chatInput.disabled=false;chatForm.querySelector('button').disabled=false;showCareerQuestion();});

companyList.forEach((company,index)=>{const option=document.createElement('option');option.value=String(index);option.textContent=company.name;select.appendChild(option);});
const industryCategories=[
 {label:'IT・情報通信',pattern:/\bIT\b|ソフトウェア|情報処理|システム|ICT|情報通信|コンピュータ/i},{label:'金融・保険',pattern:/銀行|信用金庫|金融|保険/},{label:'建設・土木・設備',pattern:/建設|土木|建築|設備工事|住宅建設|空調|給排水|地質調査/},{label:'製造・メーカー',pattern:/製造|メーカー|機器|金属|繊維|化学|精密|鉄鋼|プラスチック|加工|電池|配管継手|表面処理/},{label:'医療・福祉',pattern:/医療|福祉|介護|医薬|ヘルスケア/},{label:'食品・小売・販売',pattern:/食品|販売|小売|流通|商店|専門店|通販|ネット販売|生活協同|パン|食肉/},{label:'交通・物流',pattern:/交通|鉄道|物流|倉庫|輸送|自動車/},{label:'エネルギー・環境',pattern:/環境|リサイクル|電力|ガス|エネルギー|水処理/},{label:'商社・卸売',pattern:/商社|卸売/},{label:'人材・採用',pattern:/人材|派遣|職業紹介/},{label:'住宅・不動産・建材',pattern:/住宅|不動産|建材|エクステリア|インテリア|建築資材/},{label:'日用品・サービス',pattern:/日用品|雑貨|文具|事務機器|専門サービス|企業支援/},{label:'教育・保育',pattern:/教育|保育|学校|学習/},{label:'化学・素材',pattern:/化学|素材|石油|ガラス|塗料/}
];
const municipalities=[{label:'福井市',pattern:/福井市/},{label:'敦賀市',pattern:/敦賀市/},{label:'小浜市',pattern:/小浜市/},{label:'大野市',pattern:/大野市/},{label:'勝山市',pattern:/勝山市/},{label:'鯖江市',pattern:/鯖江市/},{label:'あわら市',pattern:/あわら市/},{label:'越前市',pattern:/越前市/},{label:'坂井市',pattern:/坂井市/},{label:'永平寺町',pattern:/永平寺町/},{label:'池田町',pattern:/池田町/},{label:'南越前町',pattern:/南越前町/},{label:'越前町',pattern:/越前町/},{label:'美浜町',pattern:/美浜町/},{label:'高浜町',pattern:/高浜町/},{label:'おおい町',pattern:/おおい町/},{label:'若狭町',pattern:/若狭町/}];
function addFilterButtons(container,options,getValue,setValue){[{label:'すべて',value:''},...options.map(({label})=>({label,value:label}))].forEach(({label,value})=>{const button=document.createElement('button');button.type='button';button.className='filter-button';button.textContent=label;button.dataset.value=value;button.setAttribute('aria-pressed','false');button.addEventListener('click',()=>setValue(value));container.appendChild(button);});}
function updateFilterButtons(){industryButtons.querySelectorAll('button').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.value===selectedIndustry)));municipalityButtons.querySelectorAll('button').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.value===selectedMunicipality)));}
function setIndustry(value){selectedIndustry=value;updateFilterButtons();renderCompanies();}
function setMunicipality(value){selectedMunicipality=value;updateFilterButtons();renderCompanies();}
addFilterButtons(industryButtons,industryCategories,()=>selectedIndustry,setIndustry);addFilterButtons(municipalityButtons,municipalities,()=>selectedMunicipality,setMunicipality);
function addMapToCard(card,company){const address=(company.address||'').trim(),mapSection=document.createElement('div');mapSection.className='company-map';const title=document.createElement('h4');title.textContent='所在地';const mapMessage=document.createElement('p');mapMessage.className='map-message';if(!address){mapMessage.textContent='住所情報が登録されていません。';mapSection.append(title,mapMessage);}else{const query=encodeURIComponent(address),iframe=document.createElement('iframe');iframe.title=`${company.name}の地図`;iframe.loading='lazy';iframe.src=`https://www.google.com/maps?q=${query}&output=embed`;const link=document.createElement('a');link.className='map-link';link.href=`https://www.google.com/maps/search/?api=1&query=${query}`;link.target='_blank';link.rel='noopener';link.textContent='Googleマップで開く';mapSection.append(title,mapMessage,iframe,link);}card.appendChild(mapSection);}
function renderCompanies(){const keyword=search.value.trim().toLocaleLowerCase(),industry=industryCategories.find(({label})=>label===selectedIndustry),municipality=municipalities.find(({label})=>label===selectedMunicipality);const filtered=companyList.map((company,index)=>({company,index})).filter(({company})=>{const haystack=`${company.name||''} ${company.address||''} ${company.info||''}`.toLocaleLowerCase();if(keyword&&!haystack.includes(keyword))return false;if(industry&&!industry.pattern.test(`${company.industry||''} ${company.info||''}`))return false;if(municipality&&!municipality.pattern.test(company.address||''))return false;return true;});countElement.textContent=`${filtered.length}件の企業が見つかりました`;resultElement.replaceChildren();filtered.forEach(({company,index})=>{const card=document.createElement('article');card.className='company-card';card.dataset.companyIndex=String(index);const name=document.createElement('h3');name.textContent=company.name||'';const address=document.createElement('p');address.textContent=company.address||'';const info=document.createElement('p');info.textContent=company.info||'';card.append(name,address,info);if(activeIndex===index)addMapToCard(card,company);card.addEventListener('click',()=>{activeIndex=activeIndex===index?null:index;renderCompanies();if(activeIndex===index)card.scrollIntoView({behavior:'smooth',block:'nearest'});});resultElement.appendChild(card);});}
select.addEventListener('change',()=>{activeIndex=Number(select.value);renderCompanies();resultElement.querySelector(`[data-company-index="${activeIndex}"]`)?.scrollIntoView({behavior:'smooth',block:'center'});});
search.addEventListener('input',renderCompanies);

// タップした位置に、水面の波紋・飛沫・わずかな発光を表示
function createWaterEffect(x,y,target){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const ripple=document.createElement('span');ripple.className='water-ripple';ripple.style.left=`${x}px`;ripple.style.top=`${y}px`;document.body.appendChild(ripple);ripple.addEventListener('animationend',()=>ripple.remove());for(let i=0;i<7;i++){const drop=document.createElement('span');drop.className='water-drop';const angle=(Math.PI*2*i/7)+(Math.random()*.35),distance=20+Math.random()*24;drop.style.left=`${x}px`;drop.style.top=`${y}px`;drop.style.setProperty('--dx',`${Math.cos(angle)*distance}px`);drop.style.setProperty('--dy',`${Math.sin(angle)*distance}px`);document.body.appendChild(drop);drop.addEventListener('animationend',()=>drop.remove());}if(target){target.classList.remove('water-press');void target.offsetWidth;target.classList.add('water-press');setTimeout(()=>target.classList.remove('water-press'),400);}}
document.addEventListener('pointerdown',event=>{const target=event.target.closest('button,.filter-button,.company-card,input,select')||event.target;if(target!==document.documentElement)createWaterEffect(event.clientX,event.clientY,target);},{passive:true});

showCareerQuestion();renderCompanies();
</script>

<!DOCTYPE html>
<html lang="ja">
<head>

  <title>福井で見つける企業・仕事 | ガクマチ</title>
  <style>
    :root { color-scheme:light; --dark:#65394e; --text:#5d4652; --muted:#886d79; --primary:#c45f88; --line:rgba(143,145,153,.48); --glass:rgba(255,249,252,.86); --silver:#aeb0b8; --silver-light:#f3f3f5; }
    * { box-sizing:border-box; }

    body { min-height:100vh; margin:0; padding:34px 18px 56px; color:var(--text); font-family:"M PLUS 1p","Hiragino Sans","Yu Gothic",sans-serif; letter-spacing:.025em; line-height:1.75; background:radial-gradient(ellipse at 8% 8%,rgba(255,255,255,.98),transparent 24%),radial-gradient(ellipse at 92% 20%,rgba(241,177,202,.55),transparent 31%),linear-gradient(160deg,#fff1f6 0%,#f8dce8 58%,#f3d4e1 100%); }

    main { max-width:1050px; margin:auto; }
    section { position:relative; isolation:isolate; overflow:hidden; padding:30px; margin-bottom:26px; border:1px solid transparent; border-radius:30px; background:linear-gradient(var(--glass),var(--glass)) padding-box,linear-gradient(145deg,#fff 0%,#a7a9b1 18%,#f9f9fa 34%,#9c9ea8 52%,#fff 72%,#b0b1b8 100%) border-box; box-shadow:0 18px 45px rgba(145,73,104,.14),inset 0 1px 0 rgba(255,255,255,.95); backdrop-filter:blur(14px); }
    section::before { content:""; position:absolute; z-index:-1; top:-90px; right:-60px; width:210px; height:210px; border:1px solid rgba(255,255,255,.8); border-radius:50%; background:radial-gradient(circle at 55% 55%,rgba(255,255,255,.78),rgba(226,136,172,.2)); }
    section>* { position:relative; }
    h1,h2,h3 { color:var(--dark); font-family:"M PLUS 1p","Hiragino Sans","Yu Gothic",sans-serif; }

    .favorites-dialog { width:min(680px,calc(100% - 28px)); max-height:min(80vh,720px); padding:24px; border:1px solid transparent; border-radius:26px; color:var(--text); background:linear-gradient(145deg,#fffafd,#f9e6ef) padding-box,linear-gradient(145deg,#fff,#a7a9b1,#f8f8f9,#999ba5,#fff) border-box; box-shadow:0 24px 70px rgba(75,55,72,.25); }
    .favorites-dialog::backdrop { background:rgba(49,40,47,.4); backdrop-filter:blur(4px); }

    .filters { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; align-items:start; }

    input,select { width:100%; min-width:0; padding:13px 15px; border:1px solid rgba(158,160,169,.58); border-radius:16px; background:rgba(255,255,255,.92); color:var(--text); font:inherit; box-shadow:inset 0 1px 0 white,0 3px 10px rgba(145,73,104,.05); }
    input::placeholder { color:#9c828e; }
    :focus-visible { outline:3px solid rgba(196,95,136,.4); outline-offset:3px; }
    .filter-group { display:grid; gap:7px; }
    .filter-label { margin:0; color:var(--dark); font-size:14px; font-weight:700; }
    .filter-buttons { display:flex; flex-wrap:wrap; gap:8px; }
    .filter-button { padding:8px 13px; border:1px solid rgba(158,160,169,.55); border-radius:999px; color:var(--dark); background:linear-gradient(145deg,#fff,#f8edf2); font:inherit; font-size:13px; box-shadow:0 3px 9px rgba(145,73,104,.08); }
    .filter-button[aria-pressed="true"] { border:1px solid transparent; color:white; background:linear-gradient(#cd6f96,#b8527d) padding-box,linear-gradient(145deg,#fff,#9699a3,#fff) border-box; }
    button { position:relative; overflow:hidden; padding:10px 17px; border:1px solid transparent; border-radius:999px; color:white; background:linear-gradient(#ce7198,#b9517c) padding-box,linear-gradient(145deg,#fff 0%,#9c9ea7 35%,#fefeff 58%,#999ba5 82%,#fff 100%) border-box; font:inherit; font-weight:700; cursor:pointer; box-shadow:0 8px 18px rgba(171,81,119,.2),inset 0 1px 0 rgba(255,255,255,.35); transition:transform .18s,filter .18s,box-shadow .18s; -webkit-tap-highlight-color:transparent; }
    button:hover { filter:brightness(1.04); transform:translateY(-1px); }

    button:disabled { opacity:.6; cursor:not-allowed; }

    .company-card { position:relative; min-width:0; padding:19px; border:1px solid transparent; border-radius:24px; background:linear-gradient(145deg,rgba(255,255,255,.94),rgba(250,224,235,.84)) padding-box,linear-gradient(145deg,#fff 0%,#a5a7b0 22%,#fff 42%,#989aa4 62%,#fff 82%,#b1b2b9 100%) border-box; box-shadow:0 12px 24px rgba(145,73,104,.12); cursor:pointer; transition:transform .2s,box-shadow .2s,background .35s; overflow:hidden; }
    .company-card::after { content:""; position:absolute; inset:-30%; border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.55),transparent 58%); transform:scale(0); opacity:0; pointer-events:none; }
    .company-card:hover { transform:translateY(-3px); box-shadow:0 16px 30px rgba(145,73,104,.18),0 0 0 1px rgba(158,160,169,.22); }
    .company-card:active { transform:scale(.985); }
    .company-card h3 { margin:0 0 5px; padding-right:42px; }
    .favorite-button { position:absolute; z-index:1; top:12px; right:12px; padding:5px 10px; border:1px solid transparent; color:#a64e74; background:linear-gradient(#fff,#f9edf2) padding-box,linear-gradient(145deg,#fff,#a5a7b0,#fff) border-box; font-size:20px; line-height:1.2; box-shadow:0 3px 10px rgba(145,73,104,.12); }
    .favorite-button.active { color:#c44778; }
    .company-card p { margin:5px 0; overflow-wrap:anywhere; color:var(--muted); font-size:14px; }
    .company-map { margin-top:16px; padding-top:12px; border-top:1px solid var(--line); }
    .company-map h4 { margin:0; color:var(--dark); }
    .company-map iframe { display:block; width:100%; height:300px; margin-top:10px; border:1px solid rgba(158,160,169,.55); border-radius:18px; background:#f7e8ef; }
    .map-link { display:inline-flex; align-items:center; justify-content:center; margin-top:10px; padding:10px 16px; border:1px solid transparent; border-radius:999px; color:#fff; background:linear-gradient(#ce7198,#b9517c) padding-box,linear-gradient(145deg,#fff,#999ba5,#fff) border-box; font-weight:700; text-decoration:none; box-shadow:0 8px 18px rgba(171,81,119,.18); }
    .map-link:hover { filter:brightness(1.05); }
    .notice { font-size:12px; }
    .career-chat { max-width:760px; margin:16px auto 0; padding:19px; border:1px solid transparent; border-radius:26px; background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(249,226,236,.84)) padding-box,linear-gradient(145deg,#fff,#a7a9b1,#fff,#999ba5,#fff) border-box; box-shadow:0 8px 24px rgba(145,73,104,.08); }
    .chat-messages { display:grid; gap:12px; max-height:360px; overflow-y:auto; padding:5px; }
    .chat-message { max-width:88%; padding:11px 15px; border:1px solid rgba(158,160,169,.35); border-radius:18px; white-space:pre-wrap; overflow-wrap:anywhere; }
    .chat-message.assistant { justify-self:start; background:rgba(255,255,255,.92); }
    .chat-message.user { justify-self:end; color:white; background:linear-gradient(135deg,#ce7198,#b9517c); }
    .chat-choices { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
    .chat-choices button { color:var(--dark); background:linear-gradient(#fff,#f8eaf1) padding-box,linear-gradient(145deg,#fff,#a7a9b1,#fff) border-box; }
    .chat-entry { display:flex; gap:8px; margin-top:14px; }
    .chat-entry input { flex:1; }
    .chat-results { margin-top:18px; padding-top:14px; border-top:1px solid var(--line); }
    .chat-results h3 { margin-top:0; }
    .chat-results li { margin:8px 0; }
    .chat-results a { color:#a64e74; font-weight:700; }
    .visually-hidden { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    .water-ripple { position:fixed; z-index:9999; width:18px; height:18px; margin:-9px 0 0 -9px; border:2px solid rgba(255,255,255,.92); border-radius:50%; pointer-events:none; box-shadow:0 0 0 3px rgba(158,160,169,.2),0 0 18px rgba(255,255,255,.75),inset 0 0 8px rgba(196,95,136,.18); animation:water-ripple .68s cubic-bezier(.16,.7,.28,1) forwards; }
    .water-ripple::before,.water-ripple::after { content:""; position:absolute; inset:-7px; border:1px solid rgba(167,169,177,.8); border-radius:50%; animation:water-ring .72s .05s ease-out forwards; }
    .water-ripple::after { inset:-14px; border-color:rgba(255,255,255,.75); animation-delay:.12s; }
    .water-drop { position:fixed; z-index:9998; width:5px; height:8px; margin:-4px 0 0 -2.5px; border-radius:50% 50% 60% 60%; pointer-events:none; background:radial-gradient(circle at 35% 25%,white 0 18%,rgba(196,95,136,.78) 36%,rgba(158,160,169,.5)); box-shadow:0 2px 5px rgba(158,160,169,.2); animation:water-drop .62s cubic-bezier(.2,.7,.35,1) forwards; }
    .water-press { animation:water-press .38s ease-out; }
    @keyframes water-ripple { 0% { transform:scale(.2); opacity:1; } 100% { transform:scale(7); opacity:0; } }
    @keyframes water-ring { 0% { transform:scale(.15); opacity:.9; } 100% { transform:scale(2.2); opacity:0; } }
    @keyframes water-drop { 0% { transform:translate(0,0) scale(.8); opacity:.9; } 100% { transform:translate(var(--dx),var(--dy)) scale(.15); opacity:0; } }
    @keyframes water-press { 0% { filter:brightness(1); } 35% { filter:brightness(1.12) saturate(.9); } 100% { filter:brightness(1); } }
    @media(max-width:600px) { body { padding:16px 10px 36px; } section { padding:21px 16px; border-radius:26px; } .company-grid { grid-template-columns:1fr; } .company-map iframe { height:260px; } .chat-entry { flex-direction:column; } .hero-heading-row { align-items:flex-start; } .favorites-open-button { width:100%; } .favorites-dialog { padding:18px; } }
    @media(prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } *,*::before,*::after { transition-duration:.01ms!important; } .water-ripple,.water-ripple::before,.water-ripple::after,.water-drop { animation-duration:.01ms!important; } }
  </style>
</head>
<body>
<main>
  <section>
    <div class="hero-heading-row"><h1>福井で見つける企業・仕事</h1><button id="favorites-open" class="favorites-open-button" type="button">♡ お気に入りリスト <span id="favorites-count" class="favorites-count" aria-label="お気に入り件数">0</span></button></div>
    <p>福井県内の企業を検索できます。企業を選ぶと、所在地を地図上に表示します。</p>
  </section>
  <dialog id="favorites-dialog" class="favorites-dialog" aria-labelledby="favorites-heading">
    <div class="favorites-dialog-header"><h2 id="favorites-heading">お気に入りリスト</h2><button id="favorites-close" class="favorites-dialog-close" type="button">閉じる</button></div>
    <div id="favorites-list" class="favorites-list"></div>
  </dialog>
  <section aria-labelledby="career-heading">
    <h2 id="career-heading">あなたに合う仕事を一緒に考えよう</h2><p class="muted">少しだけ話してくれたら、あなたの考え方に合いそうな仕事や企業を提案します。</p>
    <div class="career-chat">
      <div id="chat-messages" class="chat-messages" role="log" aria-live="polite"></div>
      <div id="chat-choices" class="chat-choices" aria-label="回答を選択"></div>
      <form id="chat-form" class="chat-entry"><label for="chat-input" class="visually-hidden">自由に入力</label><input id="chat-input" type="text" placeholder="自由に話してみてください"><button type="submit">送信</button></form>
      <div id="chat-results" class="chat-results" hidden></div><button id="chat-reset" type="button" hidden>もう一度相談する</button>
    </div><p class="notice">※回答をもとに、福井県の企業データから候補を簡単に絞り込みます。</p>
  </section>
  <section aria-labelledby="company-heading">
    <h2 id="company-heading">福井県の企業を探す</h2><p class="muted">企業名・住所・事業内容から検索し、業種や市町村で絞り込めます。</p>
    <div class="filters">
      <div class="search-filter-group">
        <label for="company-search">企業を検索<input id="company-search" type="search" placeholder="企業名・住所・事業内容" aria-label="企業名・住所・事業内容で検索"></label>
        <div class="filter-group"><p class="filter-label">業種で絞り込む</p><div id="industry-filter-buttons" class="filter-buttons" role="group" aria-label="業種で絞り込む"></div></div>
        <div class="filter-group"><p class="filter-label">市町村で絞り込む</p><div id="municipality-filter-buttons" class="filter-buttons" role="group" aria-label="福井県の市町村で絞り込む"></div></div>
      </div>
      <label for="company-select">地図に表示する企業<select id="company-select" aria-label="地図に表示する企業"></select></label>
    </div>
    <p id="company-count" role="status" aria-live="polite"></p><div id="company-results" class="company-grid"></div>
    <p class="notice">※住所が市町村までの登録の場合、その市町村で絞り込みます。地図はGoogleマップの住所検索結果を表示します。</p>
  </section>
</main>
<script src="./companies.js"></script>
<script>
'use strict';
const companyList=Array.isArray(companies)?companies:[];
const select=document.getElementById('company-select');
const search=document.getElementById('company-search');
const industryButtons=document.getElementById('industry-filter-buttons');
const municipalityButtons=document.getElementById('municipality-filter-buttons');
const resultElement=document.getElementById('company-results');
const countElement=document.getElementById('company-count');
const favoritesOpenButton=document.getElementById('favorites-open');
const favoritesCount=document.getElementById('favorites-count');
const favoritesDialog=document.getElementById('favorites-dialog');
const favoritesList=document.getElementById('favorites-list');
const favoriteStorageKey='gakumachi-favorite-companies';
function loadCompanyFavorites(){try{const saved=JSON.parse(localStorage.getItem(favoriteStorageKey)||'[]');return new Set(Array.isArray(saved)?saved.filter(key=>typeof key==='string'):[]);}catch{return new Set();}}
const favoriteCompanies=loadCompanyFavorites();
function getCompanyFavoriteKey(company){return JSON.stringify([company.name||'',company.address||'']);}
function saveCompanyFavorites(){try{localStorage.setItem(favoriteStorageKey,JSON.stringify([...favoriteCompanies]));}catch(error){console.warn('お気に入りを保存できませんでした。',error);}}
function updateFavoritesCount(){favoritesCount.textContent=String(favoriteCompanies.size);}
function renderFavoritesList(){favoritesList.replaceChildren();const favorites=companyList.filter(company=>favoriteCompanies.has(getCompanyFavoriteKey(company)));if(!favorites.length){const empty=document.createElement('p');empty.className='muted';empty.textContent='お気に入りの企業はまだ登録されていません。企業カードの♡ボタンから追加できます。';favoritesList.appendChild(empty);updateFavoritesCount();return;}favorites.forEach(company=>{const item=document.createElement('article');item.className='favorite-item';const name=document.createElement('h3');name.textContent=company.name||'企業名未登録';const address=document.createElement('p');address.textContent=company.address||'住所情報なし';const info=document.createElement('p');info.textContent=company.info||'';item.append(name,address,info);const actions=document.createElement('div');actions.className='favorite-item-actions';const removeButton=document.createElement('button');removeButton.type='button';removeButton.className='favorite-remove-button';removeButton.textContent='お気に入りから削除';removeButton.addEventListener('click',()=>{favoriteCompanies.delete(getCompanyFavoriteKey(company));saveCompanyFavorites();updateFavoritesCount();renderFavoritesList();renderCompanies();});actions.appendChild(removeButton);if(company.address){const mapLink=document.createElement('a');mapLink.className='map-link';mapLink.href=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(company.address)}`;mapLink.target='_blank';mapLink.rel='noopener';mapLink.textContent='地図を開く';actions.appendChild(mapLink);}item.appendChild(actions);favoritesList.appendChild(item);});updateFavoritesCount();}
function toggleCompanyFavorite(company,button){const key=getCompanyFavoriteKey(company),isFavorite=favoriteCompanies.has(key);if(isFavorite)favoriteCompanies.delete(key);else favoriteCompanies.add(key);const favoriteActive=!isFavorite;button.textContent=favoriteActive?'♥':'♡';button.classList.toggle('active',favoriteActive);button.setAttribute('aria-pressed',String(favoriteActive));button.setAttribute('aria-label',`${company.name||'この企業'}を${favoriteActive?'お気に入りから削除':'お気に入りに追加'}`);saveCompanyFavorites();updateFavoritesCount();if(favoritesDialog.open)renderFavoritesList();}
let activeIndex=null,selectedIndustry='',selectedMunicipality='';
favoritesOpenButton.addEventListener('click',()=>{renderFavoritesList();favoritesDialog.showModal();});
document.getElementById('favorites-close').addEventListener('click',()=>favoritesDialog.close());
const chatMessages=document.getElementById('chat-messages'),chatChoices=document.getElementById('chat-choices'),chatForm=document.getElementById('chat-form'),chatInput=document.getElementById('chat-input'),chatResults=document.getElementById('chat-results'),chatReset=document.getElementById('chat-reset');
const careerQuestions=[{text:'まず、あなたが「楽しい」と感じる仕事のタイプを選んでください。',choices:['頭を使って考える仕事','手を動かして作る仕事','人と関わる仕事','物やデータを整理する仕事']},{text:'次に、こんなときにやる気が出ますか？',choices:['新しいアイデアを考えるとき','ものづくりをしているとき','人の役に立てているとき','計画を立てて進めているとき']},{text:'最後に、働くうえで大事にしたいことはどれですか？',choices:['安定した仕事','成長できる環境','自分の考えを活かす','人間関係が良い','地域や社会に貢献']}];
let careerAnswers=[],careerStep=0;
function addChatMessage(text,speaker){const message=document.createElement('div');message.className=`chat-message ${speaker}`;message.textContent=text;chatMessages.appendChild(message);chatMessages.scrollTop=chatMessages.scrollHeight;}
function showCareerQuestion(){if(careerStep>=careerQuestions.length)return showCareerRecommendations();const question=careerQuestions[careerStep];addChatMessage(question.text,'assistant');chatChoices.replaceChildren();question.choices.forEach(choice=>{const button=document.createElement('button');button.type='button';button.textContent=choice;button.addEventListener('click',()=>submitCareerAnswer(choice));chatChoices.appendChild(button);});}
function submitCareerAnswer(answer){const clean=String(answer||'').trim();if(!clean||careerStep>=careerQuestions.length)return;careerAnswers.push(clean);addChatMessage(clean,'user');careerStep++;chatChoices.replaceChildren();setTimeout(showCareerQuestion,180);}
function getCareerMatches(){const text=careerAnswers.join(' ').toLocaleLowerCase();const groups=[{words:['考える','アイデア','分析','情報','it','システム'],industries:['ソフトウェア・情報処理','IT・システム開発・情報処理','システム開発・情報処理','精密機器','研究']},{words:['作る','ものづくり','機械','技術','設計'],industries:['精密機器','鉱業・金属製品・鉄鋼','半導体・電子・電気機器','機械・製造業','建設・土木']},{words:['人','支える','医療','社会','地域','接する'],industries:['医療用機器・医療関連','福祉・介護','人材派遣・人材紹介','地域経済・企業支援','保険']},{words:['計画','安定','数字','金融','管理'],industries:['銀行','信用金庫・金融サービス','専門商社','物流・倉庫']},{words:['地域','社会','環境','自然','エネルギー','貢献'],industries:['環境・リサイクル','水処理・環境関連サービス','電力・ガス・エネルギー','建設・土木']},{words:['販売','食','接客','商売'],industries:['食品','流通・チェーンストア','専門店（食品関連）','通信販売・ネット販売']}];const ranked=new Map();groups.forEach(({words,industries})=>{const points=words.reduce((sum,word)=>sum+(text.includes(word)?2:0),0);if(points)industries.forEach(industry=>ranked.set(industry,(ranked.get(industry)||0)+points));});return [...ranked.entries()].sort((a,b)=>b[1]-a[1]).slice(0,5).map(([industry])=>industry);}
function showCareerRecommendations(){chatChoices.replaceChildren();chatInput.disabled=true;chatForm.querySelector('button').disabled=true;addChatMessage('ありがとうございます。あなたに合いそうな仕事や企業を探してみます。','assistant');const matches=getCareerMatches();const matching=companyList.filter(company=>matches.includes(company.info)).slice(0,6);chatResults.hidden=false;chatResults.replaceChildren();const title=document.createElement('h3');title.textContent='おすすめの企業候補';chatResults.appendChild(title);if(!matching.length){const p=document.createElement('p');p.textContent='今回は条件に合う企業が見つかりませんでした。業種や市町村で絞り込み直してください。';chatResults.appendChild(p);}else{const list=document.createElement('ul');matching.forEach(company=>{const li=document.createElement('li'),link=document.createElement('a');link.href=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(company.address||company.name)}`;link.target='_blank';link.rel='noopener';link.textContent=`${company.name}｜地図を開く`;li.appendChild(link);list.appendChild(li);});chatResults.appendChild(list);}chatReset.hidden=false;}
chatForm.addEventListener('submit',event=>{event.preventDefault();const text=chatInput.value.trim();if(text)submitCareerAnswer(text);chatInput.value='';});
chatReset.addEventListener('click',()=>{careerAnswers=[];careerStep=0;chatMessages.replaceChildren();chatResults.replaceChildren();chatResults.hidden=true;chatReset.hidden=true;chatInput.disabled=false;chatForm.querySelector('button').disabled=false;showCareerQuestion();});
companyList.forEach((company,index)=>{const option=document.createElement('option');option.value=String(index);option.textContent=company.name;select.appendChild(option);});
const industryCategories=[{label:'IT・情報通信',pattern:/\bIT\b|ソフトウェア|情報処理|システム|ICT|情報通信|コンピュータ/i},{label:'金融・保険',pattern:/銀行|信用金庫|金融|保険/i},{label:'製造・ものづくり',pattern:/製造|ものづくり|精密機器|機械|電子|金属|鉄鋼|機工/i},{label:'医療・福祉',pattern:/医療|福祉|介護/i},{label:'建設・不動産',pattern:/建設|土木|不動産/i},{label:'物流・通信',pattern:/物流|運輸|倉庫|通信販売|ネット販売/i},{label:'食品・飲食',pattern:/食品|飲食|レストラン/i},{label:'エネルギー・環境',pattern:/電力|ガス|エネルギー|環境|リサイクル/i}];
const municipalities=[{label:'福井市',pattern:/福井市/},{label:'敦賀市',pattern:/敦賀市/},{label:'小浜市',pattern:/小浜市/},{label:'大野市',pattern:/大野市/},{label:'勝山市',pattern:/勝山市/},{label:'鯖江市',pattern:/鯖江市/},{label:'あわら市',pattern:/あわら市/},{label:'越前市',pattern:/越前市/},{label:'坂井市',pattern:/坂井市/},{label:'永平寺町',pattern:/永平寺町/},{label:'池田町',pattern:/池田町/},{label:'南越前町',pattern:/南越前町/},{label:'越前町',pattern:/越前町/},{label:'美浜町',pattern:/美浜町/},{label:'高浜町',pattern:/高浜町/},{label:'おおい町',pattern:/おおい町/},{label:'若狭町',pattern:/若狭町/},{label:'福井県',pattern:/福井県/}];
function addFilterButtons(container,options,getValue,setValue){[{label:'すべて',value:''},...options.map(({label})=>({label,value:label}))].forEach(({label,value})=>{const button=document.createElement('button');button.type='button';button.className='filter-button';button.textContent=label;button.dataset.value=value;button.setAttribute('aria-pressed','false');button.addEventListener('click',()=>setValue(value));container.appendChild(button);});}
function updateFilterButtons(){industryButtons.querySelectorAll('button').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.value===selectedIndustry)));municipalityButtons.querySelectorAll('button').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.value===selectedMunicipality)));}
function setIndustry(value){selectedIndustry=value;updateFilterButtons();renderCompanies();}
function setMunicipality(value){selectedMunicipality=value;updateFilterButtons();renderCompanies();}
addFilterButtons(industryButtons,industryCategories,()=>selectedIndustry,setIndustry);addFilterButtons(municipalityButtons,municipalities,()=>selectedMunicipality,setMunicipality);
function addMapToCard(card,company){const address=(company.address||'').trim(),mapSection=document.createElement('div');mapSection.className='company-map';const title=document.createElement('h4');title.textContent='地図情報';const mapMessage=document.createElement('p');mapMessage.className='map-message';if(!address){mapMessage.textContent='住所が登録されていません。住所を確認できないため地図を表示できません。';mapSection.append(title,mapMessage);}else{const query=encodeURIComponent(address),iframe=document.createElement('iframe');iframe.title=`${company.name}の地図`;iframe.loading='lazy';iframe.src=`https://www.google.com/maps?q=${query}&output=embed`;const link=document.createElement('a');link.className='map-link';link.href=`https://www.google.com/maps/search/?api=1&query=${query}`;link.target='_blank';link.rel='noopener';link.textContent='地図を開く';mapSection.append(title,iframe,link);}card.appendChild(mapSection);}
function renderCompanies(){const keyword=search.value.trim().toLocaleLowerCase(),industry=industryCategories.find(({label})=>label===selectedIndustry),municipality=municipalities.find(({label})=>label===selectedMunicipality);const filtered=companyList.map((company,index)=>({company,index})).filter(({company})=>{const haystack=`${company.name||''} ${company.address||''} ${company.info||''}`.toLocaleLowerCase();if(keyword&&!haystack.includes(keyword))return false;if(industry&&!industry.pattern.test(`${company.info||''} ${company.address||''}`))return false;if(municipality&&!municipality.pattern.test(company.address||''))return false;return true;});countElement.textContent=`${filtered.length}件の企業が表示されています`;resultElement.replaceChildren();filtered.forEach(({company,index})=>{const card=document.createElement('article');card.className='company-card';card.dataset.companyIndex=String(index);const favoriteButton=document.createElement('button');favoriteButton.type='button';favoriteButton.className='favorite-button';const favoriteActive=favoriteCompanies.has(getCompanyFavoriteKey(company));favoriteButton.textContent=favoriteActive?'♥':'♡';favoriteButton.classList.toggle('active',favoriteActive);favoriteButton.setAttribute('aria-pressed',String(favoriteActive));favoriteButton.setAttribute('aria-label',`${company.name||'この企業'}を${favoriteActive?'お気に入りから削除':'お気に入りに追加'}`);favoriteButton.addEventListener('click',event=>{event.stopPropagation();toggleCompanyFavorite(company,favoriteButton);});const name=document.createElement('h3');name.textContent=company.name||'';const address=document.createElement('p');address.textContent=company.address||'';const info=document.createElement('p');info.textContent=company.info||'';card.append(favoriteButton,name,address,info);if(activeIndex===index)addMapToCard(card,company);card.addEventListener('click',()=>{activeIndex=activeIndex===index?null:index;renderCompanies();if(activeIndex===index)card.scrollIntoView({behavior:'smooth',block:'nearest'});});resultElement.appendChild(card);});}
select.addEventListener('change',()=>{activeIndex=Number(select.value);renderCompanies();resultElement.querySelector(`[data-company-index="${activeIndex}"]`)?.scrollIntoView({behavior:'smooth',block:'center'});});
search.addEventListener('input',renderCompanies);
function createWaterEffect(x,y,target){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const ripple=document.createElement('span');ripple.className='water-ripple';ripple.style.left=`${x}px`;ripple.style.top=`${y}px`;document.body.appendChild(ripple);ripple.addEventListener('animationend',()=>ripple.remove());for(let i=0;i<7;i++){const drop=document.createElement('span');drop.className='water-drop';const angle=(Math.PI*2*i/7)+(Math.random()*35);const distance=20+Math.random()*24;drop.style.left=`${x}px`;drop.style.top=`${y}px`;drop.style.setProperty('--dx',`${Math.cos(angle)*distance}px`);drop.style.setProperty('--dy',`${Math.sin(angle)*distance}px`);document.body.appendChild(drop);drop.addEventListener('animationend',()=>drop.remove());}if(target){target.classList.remove('water-press');void target.offsetWidth;target.classList.add('water-press');setTimeout(()=>target.classList.remove('water-press'),400);}}
document.addEventListener('pointerdown',event=>{const target=event.target.closest('button,.filter-button,.company-card,input,select')||event.target;if(target!==document.documentElement)createWaterEffect(event.clientX,event.clientY,target);},{passive:true});
updateFavoritesCount();showCareerQuestion();renderCompanies();
</script>
</body>

<style>
:root {
  --bg-1: #eef6ff;

  --accent: #f0a35d;

* {
  box-sizing: border-box;
}
html {
  scroll-behavior: smooth;
}
body {
  position: relative;
  overflow-x: hidden;
  font-family: "Yu Gothic", "Hiragino Sans", sans-serif;
  background:
    radial-gradient(circle at 15% 15%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 22%),
    radial-gradient(circle at 80% 12%, rgba(137, 200, 255, 0.25) 0%, rgba(137, 200, 255, 0) 20%),
    linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
  margin: 0;
  padding: 32px 18px 48px;
  color: var(--text);
}
body::before {
  content: "";
  position: fixed;
  inset: -10% -8% -8% -8%;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 8% 14%, rgba(255,255,255,0.9) 0 3.5%, transparent 4%),
    radial-gradient(circle at 20% 38%, rgba(255,255,255,0.85) 0 4.5%, transparent 5%),
    radial-gradient(circle at 70% 18%, rgba(255,255,255,0.8) 0 4.5%, transparent 5%),
    radial-gradient(circle at 56% 68%, rgba(255,255,255,0.7) 0 5%, transparent 5.4%),
    radial-gradient(circle at 88% 42%, rgba(255,255,255,0.7) 0 3%, transparent 3.5%),
    radial-gradient(circle at 36% 80%, rgba(255,255,255,0.8) 0 4%, transparent 4.5%);
  filter: blur(2px);
  opacity: 0.85;
}
main {
  position: relative;
  z-index: 1;
  max-width: 980px;
  margin: 0 auto;
}
h1 {
  color: var(--primary-dark);
  margin: 0 0 12px;
  font-size: clamp(2rem, 3vw, 2.8rem);
  letter-spacing: 0.04em;
  text-shadow: 0 4px 12px rgba(255,255,255,0.7);
}
p {
  margin: 0 0 12px;
  color: var(--muted);
}
input, select {
  width: 100%;
  padding: 16px 18px;
  font-size: 16px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255,255,255,0.82);
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.03), 0 8px 18px rgba(87, 125, 160, 0.08);
  color: var(--text);
  transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
}
input:focus, select:focus {
  outline: none;
  border-color: rgba(31, 93, 140, 0.45);
  box-shadow: 0 0 0 4px rgba(31, 93, 140, 0.12), 0 8px 18px rgba(87, 125, 160, 0.08);
}
input {
  margin-bottom: 14px;
}
select {
  margin-bottom: 18px;
}
#count {
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 18px;
}
.company {
  background: linear-gradient(180deg, rgba(255,255,255,0.82), rgba(235,245,255,0.72));
  padding: 14px 16px 10px;
  margin-bottom: 18px;
  border-radius: 30px;
  border: 1px solid rgba(142, 180, 219, 0.45);
  box-shadow: 0 14px 28px rgba(92, 128, 173, 0.12), inset 0 1px 0 rgba(255,255,255,0.8);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  backdrop-filter: blur(6px);
}
.company:hover {
  transform: translateY(-2px);
  box-shadow: 0 16px 34px rgba(92, 128, 173, 0.15), inset 0 1px 0 rgba(255,255,255,0.8);
}
.company button {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border: 0;
  background: rgba(255,255,255,0.4);
  color: var(--primary-dark);
  font-size: 1.05rem;
  font-weight: 700;
  text-align: left;
  cursor: pointer;
  padding: 14px 16px;
  border-radius: 999px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.7);
}
.company button:hover {
  background: rgba(255,255,255,0.62);
}
.detail {
  line-height: 1.8;
  margin-top: 12px;
  padding: 14px 16px 8px;
  border-top: 1px solid rgba(122, 165, 204, 0.42);
  background: rgba(255,255,255,0.38);
  border-radius: 20px;
}
.detail p {
  margin: 0 0 8px;
  color: var(--text);
  font-size: 0.98rem;
}
[hidden] {
  display: none;
}
@media (max-width: 600px) {
  body {
    padding-left: 12px;
    padding-right: 12px;
  }
  .company {
    padding-left: 12px;
    padding-right: 12px;
  }
  .company button {
    padding-left: 12px;
    padding-right: 12px;
  }
}
</style>

const search = document.getElementById("search");
const industry = document.getElementById("industry");
const list = document.getElementById("list");
const count = document.getElementById("count");
function showCompanies() {
  const keyword = search.value.trim().toLowerCase();
  const selected = industry.value;
  const filtered = companies.filter(company => {
    const text = (
      company.name + company.address + company.info
    ).toLowerCase();
    return text.includes(keyword) &&
      (!selected || company.industry === selected);
  });
  list.replaceChildren();
  count.textContent =
    filtered.length + "社の企業が見つかりました";
  filtered.forEach(company => {
    const card = document.createElement("div");
    card.className = "company";
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = "＋ " + company.name;
    button.setAttribute("aria-expanded", "false");
    const detail = document.createElement("div");
    detail.className = "detail";
    detail.hidden = true;
    const address = document.createElement("p");
    address.textContent = "所在地：" + company.address;
    const type = document.createElement("p");
    type.textContent = "業種：" + company.industry;
    const info = document.createElement("p");
    info.textContent = "企業情報：" + company.info;
    detail.append(address, type, info);
    button.addEventListener("click", () => {
      detail.hidden = !detail.hidden;
      button.textContent =
        (detail.hidden ? "＋ " : "－ ") + company.name;
      button.setAttribute(
        "aria-expanded",
        String(!detail.hidden)
      );
    });
    card.append(button, detail);
    list.append(card);
  });
}
search.addEventListener("input", showCompanies);
industry.addEventListener("change", showCompanies);
showCompanies();

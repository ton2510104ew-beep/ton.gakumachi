<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>仕事相談・おすすめ提案</title>
  <style>
    :root {
      --bg-1: #eefcf9;
      --bg-2: #e9f9fb;
      --bg-3: #dff8f1;
      --primary: #61c6c0;
      --primary-deep: #2a8a8a;
      --primary-dark: #1a4d5a;
      --text: #234c54;
      --muted: #5d7b7d;
      --success: #69c7ad;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      position: relative;
      overflow-x: hidden;
      margin: 0;
      padding: 32px 18px 52px;
      color: var(--text);
      font-family: "Yu Gothic", "Hiragino Sans", sans-serif;
      background:
        radial-gradient(circle at 15% 12%, rgba(255,255,255,.8), transparent 20%),
        radial-gradient(circle at 82% 18%, rgba(176,245,236,.28), transparent 18%),
        linear-gradient(180deg,var(--bg-1),var(--bg-2) 40%,var(--bg-3));
    }
    body::before, body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      background:
        radial-gradient(circle at 10% 18%,rgba(255,255,255,.9) 0 5%,transparent 5.5%),
        radial-gradient(circle at 24% 44%,rgba(255,255,255,.82) 0 6%,transparent 6.7%),
        radial-gradient(circle at 62% 25%,rgba(255,255,255,.78) 0 4.8%,transparent 5.5%),
        radial-gradient(circle at 58% 72%,rgba(255,255,255,.86) 0 4.5%,transparent 5.2%),
        radial-gradient(circle at 86% 38%,rgba(255,255,255,.8) 0 5.2%,transparent 6.1%);
      filter: blur(3px);
    }
    body::after {
      background:
        radial-gradient(circle at 18% 10%,rgba(163,233,238,.22) 0 9%,transparent 9.6%),
        radial-gradient(circle at 72% 12%,rgba(163,233,238,.18) 0 8%,transparent 8.8%);
      filter: blur(6px);
    }
    main { position: relative; z-index: 1; max-width: 1000px; margin: 0 auto; }
    .hero {
      display: grid;
      grid-template-columns: .9fr 1.1fr;
      gap: 24px;
      align-items: stretch;
    }
    .hero-card, .chat-card {
      background: rgba(255,255,255,.48);
      border: 2px solid rgba(255,255,255,.85);
      border-radius: 30px;
      box-shadow: 0 18px 30px rgba(55,128,133,.1), inset 0 0 20px rgba(255,255,255,.2);
      backdrop-filter: blur(10px);
    }
    .hero-card { padding: 28px 26px 22px; }
    h1 {
      margin: 16px 0 12px;
      color: var(--primary-dark);
      font-size: clamp(2.1rem,4vw,3.6rem);
      letter-spacing: .04em;
      line-height: 1.1;
    }
    .lead { margin: 0; color: var(--muted); line-height: 1.8; font-size: 1.05rem; }
    .stats { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; margin-top: 22px; }
    .stat { padding: 14px 10px; background: rgba(255,255,255,.45); border: 1px solid rgba(111,191,195,.65); border-radius: 18px; text-align: center; }
    .stat strong { display: block; color: var(--primary-dark); font-size: 1.2rem; margin-bottom: 4px; }
    .stat span { color: var(--muted); font-size: .82rem; }
    .chat-card { padding: 18px; display: flex; flex-direction: column; min-height: 520px; }
    .chat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 4px 4px 10px; }
    .chat-title { color: var(--primary-dark); font-weight: 700; font-size: 1.08rem; }
    .online { display: inline-flex; align-items: center; gap: 8px; color: #1e8f7a; font-size: .8rem; font-weight: 700; }
    .online::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 6px rgba(105,199,173,.18); }
    .messages { flex: 1; min-height: 220px; max-height: 560px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 16px 14px; background: rgba(255,255,255,.3); border: 1px solid rgba(111,191,195,.6); border-radius: 24px; }
    .message { max-width: 94%; padding: 12px 14px; border-radius: 18px; line-height: 1.6; font-size: .94rem; box-shadow: 0 8px 18px rgba(41,116,124,.06); white-space: pre-line; }
    .message.bot { align-self: flex-start; background: rgba(255,255,255,.9); color: var(--text); border-top-left-radius: 8px; }
    .message.user { align-self: flex-end; background: rgba(122,219,215,.3); color: var(--primary-dark); border-top-right-radius: 8px; }
    .quick-replies { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 8px; }
    .chip { padding: 8px 12px; border-radius: 999px; border: 1px solid rgba(111,191,195,.72); background: rgba(255,255,255,.75); color: var(--primary-dark); cursor: pointer; font-size: .8rem; font-weight: 700; }
    .composer { display: flex; gap: 10px; margin-top: 10px; }
    .composer input { flex: 1; min-width: 0; padding: 14px 16px; border: 1px solid rgba(111,191,195,.7); border-radius: 999px; background: rgba(255,255,255,.76); color: var(--text); font-size: 16px; }
    .composer button { min-width: 100px; border: 0; border-radius: 999px; background: linear-gradient(135deg,var(--primary),#9ae3d8); color: white; font-weight: 700; cursor: pointer; }
    .recommendations { display: grid; gap: 8px; width: min(100%, 460px); }
    .recommendation { padding: 12px; border: 1px solid rgba(111,191,195,.65); border-radius: 16px; background: linear-gradient(135deg,rgba(255,255,255,.94),rgba(224,250,248,.9)); }
    .recommendation strong { display: block; margin-bottom: 4px; color: var(--primary-dark); }
    .recommendation p { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.6; }
    .recommendation-note { margin: 0; color: var(--muted); font-size: .8rem; }
    @media (max-width: 800px) { .hero { grid-template-columns: 1fr; } .chat-card { min-height: 480px; } }
    @media (max-width: 600px) { body { padding: 18px 12px 36px; } .hero-card,.chat-card { padding: 16px; } .stats { grid-template-columns: 1fr; } .composer { flex-direction: column; } .composer button { min-height: 46px; } }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <div class="hero-card">
        <h1>自分に合う仕事を見つけよう</h1>
        <p class="lead">仕事探しは不安で、何から始めればいいかわからないことがあります。<br>好きなことや得意なことをチャットで教えてください。会話をもとに、おすすめの仕事を提案します。</p>
        <div class="stats">
          <div class="stat"><strong>チャット</strong><span>気軽に相談</span></div>
          <div class="stat"><strong>おすすめ</strong><span>興味に合わせて提案</span></div>
        </div>
      </div>
      <div class="chat-card">
        <div class="chat-header"><div class="chat-title">仕事相談チャット</div><div class="online">オンライン</div></div>
        <div class="messages" id="messages" aria-live="polite">
          <div class="message bot">こんにちは！どんなことが好きですか？人と話すこと、PC、ものづくりなど、興味や得意なことを教えてください。何回かお話ししたあと、あなたに合いそうな仕事を提案します。</div>
        </div>
        <div class="quick-replies">
          <button class="chip" type="button">人と話すのが好き</button>
          <button class="chip" type="button">PCやITに興味がある</button>
          <button class="chip" type="button">創作・デザインが好き</button>
          <button class="chip" type="button">福井で働きたい</button>
        </div>
        <div class="composer">
          <input id="userInput" type="text" placeholder="例：人と話すのが好きです" aria-label="相談内容を入力">
          <button type="button" id="sendBtn">送信</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const messages = document.getElementById("messages");
    const userInput = document.getElementById("userInput");
    const userMessages = [];

    const jobOptions = [
      { title: "営業・接客", about: "人と話し、相手の希望に合わせて商品やサービスを提案する仕事です。", words: ["人と", "話", "接客", "営業", "相談", "コミュニケーション", "販売", "人が好き"] },
      { title: "ITサポート・システム運用", about: "PCやシステムの困りごとを解決し、利用する人を支える仕事です。", words: ["pc", "it", "パソコン", "技術", "コンピューター", "プログラミング", "データ", "機械"] },
      { title: "Web・グラフィックデザイン", about: "アイデアや色・形の工夫を使い、Webサイトや制作物を形にする仕事です。", words: ["デザイン", "創作", "作る", "美術", "イラスト", "絵", "動画", "写真"] },
      { title: "事務・総務", about: "書類やデータを整理し、チームの仕事が進むように支える仕事です。", words: ["事務", "整理", "正確", "コツコツ", "書類", "計画", "落ち着"] },
      { title: "ものづくり・製造", about: "製品を作ったり品質を確かめたりして、形に残る成果を生み出す仕事です。", words: ["ものづくり", "製造", "工場", "手を動か", "作業", "細かい", "品質"] },
      { title: "福祉・教育サポート", about: "相手の成長や日々の暮らしに寄り添い、必要な支援を行う仕事です。", words: ["子ども", "教育", "福祉", "助け", "支援", "人の役に", "教える", "保育"] },
      { title: "企画・広報", about: "情報を集めてアイデアを考え、イベントやサービスの魅力を伝える仕事です。", words: ["企画", "広報", "発信", "イベント", "アイデア", "考える", "文章"] }
    ];

    function addMessage(text, role = "bot") {
      const div = document.createElement("div");
      div.className = `message ${role}`;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function recommendJobs() {
      const profile = userMessages.join(" ").toLowerCase();
      const ranked = jobOptions.map((job, index) => ({
        ...job,
        score: job.words.reduce((score, word) => score + (profile.includes(word) ? 1 : 0), 0),
        index
      })).sort((a, b) => b.score - a.score || a.index - b.index).slice(0, 3);
      const recommendations = document.createElement("div");
      recommendations.className = "recommendations";
      const note = document.createElement("p");
      note.className = "recommendation-note";
      note.textContent = "お話の内容から考えたおすすめです。気になる仕事があれば、理由や仕事内容をさらに聞いてください。";
      recommendations.appendChild(note);
      ranked.forEach(job => {
        const card = document.createElement("article");
        card.className = "recommendation";
        const title = document.createElement("strong");
        title.textContent = job.title;
        const description = document.createElement("p");
        description.textContent = job.about;
        card.append(title, description);
        recommendations.appendChild(card);
      });
      messages.appendChild(recommendations);
      messages.scrollTop = messages.scrollHeight;
    }

    function replyToConversation() {
      if (userMessages.length === 1) {
        return "教えてくれてありがとうございます。ほかに好きなことや、仕事で大切にしたいこと（人と関わる・落ち着いて作業する・福井で働くなど）はありますか？もう少し聞いてからおすすめを考えます。";
      }
      if (userMessages.length === 2) {
        addMessage("ありがとうございます。お話に出た興味や希望をもとに、おすすめの仕事を考えました。");
        recommendJobs();
        return "この中で気になる仕事はありますか？選んだ理由や仕事内容についても一緒に考えられます。";
      }
      return "なるほど、その希望も大切ですね。先ほどのおすすめの中から、気になるものを教えてください。希望に合わせて候補を絞り込めます。";
    }

    function sendMessage() {
      const value = userInput.value.trim();
      if (!value) return;
      addMessage(value, "user");
      userMessages.push(value);
      userInput.value = "";
      window.setTimeout(() => addMessage(replyToConversation()), 250);
    }

    document.getElementById("sendBtn").addEventListener("click", sendMessage);
    userInput.addEventListener("keydown", event => {
      if (event.key === "Enter") sendMessage();
    });
    document.querySelectorAll(".chip").forEach(button => button.addEventListener("click", () => {
      userInput.value = button.textContent;
      sendMessage();
    }));
  </script>
</body>
</html>

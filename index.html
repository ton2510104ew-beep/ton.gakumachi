<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>仕事相談・福井の企業紹介</title>
  <style>
    :root {
      --bg-1: #eefcf9; --bg-2: #e9f9fb; --bg-3: #dff8f1;
      --primary: #61c6c0; --primary-deep: #2a8a8a; --primary-dark: #1a4d5a;
      --text: #234c54; --muted: #5d7b7d; --success: #69c7ad;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      position: relative; overflow-x: hidden; margin: 0; padding: 32px 18px 52px;
      color: var(--text); font-family: "Yu Gothic", "Hiragino Sans", sans-serif;
      background: radial-gradient(circle at 15% 12%, rgba(255,255,255,.8), transparent 20%),
        radial-gradient(circle at 82% 18%, rgba(176,245,236,.28), transparent 18%),
        linear-gradient(180deg,var(--bg-1),var(--bg-2) 40%,var(--bg-3));
    }
    main { position: relative; z-index: 1; max-width: 1000px; margin: 0 auto; }
    .hero { display: grid; grid-template-columns: .9fr 1.1fr; gap: 24px; align-items: stretch; }
    .hero-card, .chat-card, .panel {
      background: rgba(255,255,255,.68); border: 2px solid rgba(255,255,255,.9);
      border-radius: 26px; box-shadow: 0 18px 30px rgba(55,128,133,.1);
    }
    .hero-card { padding: 28px 26px 22px; }
    h1 { margin: 16px 0 12px; color: var(--primary-dark); font-size: clamp(2.1rem,4vw,3.6rem); letter-spacing: .04em; line-height: 1.1; }
    .lead, .panel-intro { color: var(--muted); line-height: 1.8; }
    .chat-card { padding: 18px; display: flex; flex-direction: column; min-height: 450px; }
    .chat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .chat-title { color: var(--primary-dark); font-weight: 700; }
    .online { color: #1e8f7a; font-size: .8rem; font-weight: 700; }
    .messages { flex: 1; min-height: 220px; max-height: 420px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 14px; background: rgba(255,255,255,.45); border-radius: 16px; }
    .message { max-width: 94%; padding: 12px 14px; border-radius: 16px; line-height: 1.6; font-size: .94rem; white-space: pre-line; }
    .message.bot { align-self: flex-start; background: #fff; }
    .message.user { align-self: flex-end; background: rgba(122,219,215,.35); }
    .quick-replies { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 8px; }
    button, input, select { font: inherit; }
    .chip, .search-button { padding: 9px 13px; border-radius: 999px; border: 1px solid rgba(111,191,195,.72); background: rgba(255,255,255,.9); color: var(--primary-dark); cursor: pointer; }
    .composer { display: flex; gap: 10px; margin-top: 10px; }
    .composer input, .search-box input, .search-box select { width: 100%; padding: 13px 15px; border: 1px solid rgba(111,191,195,.7); border-radius: 999px; background: rgba(255,255,255,.9); color: var(--text); }
    .composer input { flex: 1; min-width: 0; }
    .composer button, .search-button { border: 0; background: linear-gradient(135deg,var(--primary),#9ae3d8); color: #fff; font-weight: 700; }
    .composer button { min-width: 90px; border-radius: 999px; cursor: pointer; }
    .panel { padding: 22px 20px 18px; margin-top: 24px; }
    .panel h2 { margin: 0 0 8px; color: var(--primary-dark); font-size: 1.3rem; }
    .panel-intro { margin: 0 0 16px; }
    .search-box { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px; }
    .search-button { min-height: 48px; padding: 10px 20px; }
    .company-count { margin: 14px 0; color: var(--primary-deep); font-weight: 700; }
    .company-list { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
    .company-card { padding: 15px; border: 1px solid rgba(111,191,195,.65); border-radius: 16px; background: linear-gradient(135deg,rgba(255,255,255,.96),rgba(224,250,248,.9)); }
    .company-card h3 { margin: 0 0 8px; color: var(--primary-dark); font-size: 1.05rem; }
    .company-card p { margin: 5px 0 0; color: var(--muted); font-size: .9rem; line-height: 1.6; overflow-wrap: anywhere; }
    .empty { color: var(--muted); }
    @media (max-width: 800px) { .hero { grid-template-columns: 1fr; } }
    @media (max-width: 600px) {
      body { padding: 18px 12px 36px; }
      .hero-card, .chat-card, .panel { padding: 16px; }
      .company-list { grid-template-columns: 1fr; }
      .search-box { grid-template-columns: 1fr; }
      .composer { flex-direction: column; }
      .composer button { min-height: 46px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <div class="hero-card">
        <h1>自分に合う仕事を見つけよう</h1>
        <p class="lead">好きなことや得意なことをチャットで教えてください。福井県内の企業情報も、業種や勤務地から探せます。</p>
      </div>
      <div class="chat-card">
        <div class="chat-header"><div class="chat-title">仕事相談チャット</div><div class="online">● オンライン</div></div>
        <div class="messages" id="messages" aria-live="polite">
          <div class="message bot">こんにちは！どんなことが好きですか？興味や得意なこと、希望する勤務地などを教えてください。</div>
        </div>
        <div class="quick-replies">
          <button class="chip" type="button">人と話すのが好き</button>
          <button class="chip" type="button">PCやITに興味がある</button>
          <button class="chip" type="button">ものづくりに興味がある</button>
          <button class="chip" type="button">福井で働きたい</button>
        </div>
        <div class="composer">
          <input id="userInput" type="text" placeholder="例：人と話すのが好きです" aria-label="相談内容を入力">
          <button type="button" id="sendBtn">送信</button>
        </div>
      </div>
    </section>

    <section class="panel" aria-labelledby="companies-title">
      <h2 id="companies-title">福井県内の企業</h2>
      <p class="panel-intro">企業名・所在地・業種で検索できます。掲載情報は参考情報です。応募前に各企業の公式情報をご確認ください。</p>
      <div class="search-box">
        <input id="company-search" type="search" placeholder="企業名・市町・業種で検索" aria-label="企業名、所在地、業種で検索">
        <button class="search-button" type="button" id="clear-search">検索をクリア</button>
      </div>
      <p class="company-count" id="company-count" role="status" aria-live="polite"></p>
      <div class="company-list" id="company-list"></div>
    </section>
  </main>

  <script>
    const companies = [
      { name: "株式会社PLANT", address: "〒919-0521 福井県坂井市坂井町下新庄15号8番地の1", info: "流通・チェーンストア" },
      { name: "株式会社アイシン福井", address: "〒915-8520 福井県越前市池ノ上町38", info: "輸送用機器（自動車含む）" },
      { name: "日華化学株式会社", address: "〒910-0017 福井県福井市文京4丁目23番1号", info: "ガラス・化学・石油" },
      { name: "株式会社松屋アールアンドディ", address: "〒912-0071 福井県大野市鍬掛20番地1番地2", info: "精密機器" },
      { name: "株式会社福井銀行", address: "〒910-8660 福井県福井市順化1丁目1番1号", info: "銀行" },
      { name: "前田工繊株式会社", address: "〒919-0422 福井県坂井市春江町沖布目38番地3", info: "建設・土木" },
      { name: "三谷商事株式会社", address: "〒910-8510 福井県福井市豊島1丁目3番1号（三谷ビル）", info: "総合商社" },
      { name: "株式会社ジャクエツ", address: "〒914-0125 福井県敦賀市若葉町2丁目1770番地", info: "インテリア・住宅関連" },
      { name: "株式会社シャルマン", address: "〒916-8555 福井県鯖江市川去町6番地1", info: "精密機器" },
      { name: "トラストファーマテック株式会社", address: "〒919-0603 福井県あわら市矢地5番地15", info: "化粧品・医薬品" },
      { name: "日東シンコー株式会社", address: "〒910-0381 福井県坂井市丸岡町舟寄110号1番地1", info: "ガラス・化学・石油" },
      { name: "福井トヨタ株式会社", address: "〒918-8017 福井県福井市下荒井町第19号50番地", info: "自動車関連" },
      { name: "株式会社アートテクノロジー", address: "〒916-0037 福井県鯖江市上河端町第6号1番地33", info: "ソフトウェア・情報処理" },
      { name: "株式会社日本ピーエス", address: "〒914-0027 福井県敦賀市若泉町3番地", info: "建設・土木" },
      { name: "株式会社ニホンパッケージ", address: "〒918-8188 福井県福井市三尾野町第29号2番地29", info: "物流・倉庫" },
      { name: "三谷セキサン株式会社", address: "〒910-8571 福井県福井市豊島1丁目3番1号（三谷ビル）", info: "プラント・エンジニアリング" },
      { name: "株式会社ヒューマン・デザイン", address: "〒918-8114 福井県福井市羽水2丁目701番地", info: "人材派遣・人材紹介" },
      { name: "福井県医療生活協同組合", address: "〒910-0026 福井県福井市光陽2丁目18番15号", info: "生活協同組合" },
      { name: "株式会社ながすぎ", address: "〒916-0028 福井県鯖江市小黒町1丁目15番23号", info: "食品関連の専門店" }
    ];

    const companyList = document.getElementById("company-list");
    const companySearch = document.getElementById("company-search");
    const companyCount = document.getElementById("company-count");

    function renderCompanies() {
      const query = companySearch.value.trim().toLocaleLowerCase("ja");
      const filtered = companies.filter(company =>
        `${company.name} ${company.address} ${company.info}`.toLocaleLowerCase("ja").includes(query)
      );
      companyList.replaceChildren();
      companyCount.textContent = `${filtered.length}社を表示中`;
      if (filtered.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "該当する企業が見つかりません。検索語を変えてお試しください。";
        companyList.appendChild(empty);
        return;
      }
      filtered.forEach(company => {
        const card = document.createElement("article");
        card.className = "company-card";
        const name = document.createElement("h3");
        name.textContent = company.name;
        const address = document.createElement("p");
        address.textContent = `所在地：${company.address}`;
        const info = document.createElement("p");
        info.textContent = `業種：${company.info}`;
        card.append(name, address, info);
        companyList.appendChild(card);
      });
    }

    companySearch.addEventListener("input", renderCompanies);
    document.getElementById("clear-search").addEventListener("click", () => {
      companySearch.value = "";
      renderCompanies();
      companySearch.focus();
    });
    renderCompanies();

    const messages = document.getElementById("messages");
    const userInput = document.getElementById("userInput");
    function sendMessage() {
      const value = userInput.value.trim();
      if (!value) return;
      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = value;
      messages.appendChild(userMessage);
      userInput.value = "";
      window.setTimeout(() => {
        const reply = document.createElement("div");
        reply.className = "message bot";
        reply.textContent = "教えてくれてありがとうございます。企業一覧では、気になる業種や勤務地を検索してみてください。";
        messages.appendChild(reply);
        messages.scrollTop = messages.scrollHeight;
      }, 250);
      messages.scrollTop = messages.scrollHeight;
    }
    document.getElementById("sendBtn").addEventListener("click", sendMessage);
    userInput.addEventListener("keydown", event => { if (event.key === "Enter") sendMessage(); });
    document.querySelectorAll(".chip").forEach(button => button.addEventListener("click", () => {
      userInput.value = button.textContent;
      sendMessage();
    }));
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>福井県 企業情報一覧</title>
<style>
:root {
  --bg-1: #eef6ff;
  --bg-2: #f9f4ee;
  --primary: #1f5d8c;
  --primary-dark: #123f62;
  --accent: #f0a35d;
  --accent-soft: #fff1e1;
  --card: #ffffff;
  --text: #233447;
  --muted: #58718a;
  --line: #dfeaf5;
  --shadow: rgba(23, 58, 94, 0.12);
}

* { box-sizing: border-box; }

body {
  font-family: "Yu Gothic", "Hiragino Sans", sans-serif;
  background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
  margin: 0;
  padding: 32px 18px;
  color: var(--text);
}

main {
  max-width: 900px;
  margin: 0 auto;
}

h1 {
  color: var(--primary-dark);
  margin: 0 0 10px;
  font-size: clamp(2rem, 3vw, 2.6rem);
  letter-spacing: 0.04em;
}

p {
  margin: 0 0 12px;
  color: var(--muted);
}

input, select {
  width: 100%;
  padding: 14px 16px;
  font-size: 16px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(255,255,255,0.9);
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.03);
  color: var(--text);
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

input:focus, select:focus {
  outline: none;
  border-color: rgba(31, 93, 140, 0.5);
  box-shadow: 0 0 0 4px rgba(31, 93, 140, 0.12);
}

input { margin-bottom: 14px; }
select { margin-bottom: 18px; }

#count {
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 18px;
}

.company {
  background: var(--card);
  padding: 18px 18px 10px;
  margin-bottom: 14px;
  border-radius: 16px;
  border: 1px solid var(--line);
  box-shadow: 0 8px 20px var(--shadow);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.company:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 24px rgba(23, 58, 94, 0.14);
}

.company button {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border: 0;
  background: linear-gradient(180deg, #f8fbff 0%, #edf5ff 100%);
  color: var(--primary-dark);
  font-size: 1.05rem;
  font-weight: 700;
  text-align: left;
  cursor: pointer;
  padding: 12px 14px;
  border-radius: 12px;
}

.company button:hover {
  background: linear-gradient(180deg, #edf5ff 0%, #e4f0ff 100%);
}

.detail {
  line-height: 1.8;
  margin-top: 12px;
  padding: 14px 12px 6px;
  border-top: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(240,163,93,0.05), rgba(255,255,255,0));
  border-radius: 10px;
}

.detail p {
  margin: 0 0 8px;
  color: var(--text);
  font-size: 0.98rem;
}

[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>福井県 企業情報一覧</h1>
  <p>福井県に関係する企業を検索できます。</p>

  <input id="search" type="text" placeholder="企業名・住所・キーワードで検索">

  <select id="industry">
    <option value="">すべての業種</option>
    <option value="IT">IT・情報通信</option>
    <option value="金融">金融</option>
    <option value="小売">小売・流通</option>
    <option value="その他">その他</option>
  </select>

  <p id="count"></p>
  <div id="list"></div>
</main>

<script>

  },
  {

    info: "ドラッグストア"
  },
  {
    name: "株式会社PLANT",
    industry: "その他",
    address: "〒919-0521 福井県坂井市坂井町下新庄15号8番地の1",
    info: "事業者情報"
  },

  {
    name: "株式会社アイシン福井",
    industry: "その他",
    address: "福井県越前市",
    info: "輸送用機器（自動車含む）"
  },
  {
    name: "日華化学株式会社",
    industry: "その他",
    address: "福井県福井市",
    info: "ガラス・化学・石油"
  },
  {
    name: "株式会社松屋アールアンドディ",
    industry: "その他",
    address: "福井県大野市",
    info: "精密機器"
  },
  {
    name: "株式会社福井銀行",
    industry: "金融",
    address: "福井県福井市",
    info: "銀行"
  },
  {
    name: "前田工繊株式会社",
    industry: "その他",
    address: "福井県坂井市",
    info: "建設・土木"
  },
  {
    name: "三谷商事株式会社",
    industry: "その他",
    address: "福井県福井市",
    info: "総合商社"
  },
  {
    name: "株式会社ジャクエツ",
    industry: "その他",
    address: "福井県敦賀市",
    info: "インテリア・住宅関連"
  },
  {
    name: "株式会社シャルマン",
    industry: "その他",
    address: "福井県鯖江市",
    info: "精密機器"
  },
  {
    name: "トラストファーマテック株式会社",
    industry: "その他",
    address: "福井県あわら市",
    info: "化粧品・医薬品"
  },
  {
    name: "日東シンコー株式会社",
    industry: "その他",
    address: "福井県坂井市",
    info: "ガラス・化学・石油"
  },
  {
    name: "福井トヨタ株式会社",
    industry: "その他",
    address: "福井県福井市",
    info: "自動車関連"
  },
  {
    name: "株式会社アートテクノロジー",
    industry: "IT",
    address: "福井県鯖江市",
    info: "ソフトウェア・情報処理"
  },
  {
    name: "株式会社日本ピーエス",

  },
  {
    name: "株式会社ニホンパッケージ",
    industry: "その他",

    info: "物流・倉庫"
  },
  {
    name: "三谷セキサン株式会社",
    industry: "その他",
    address: "福井県福井市",
    info: "プラント・エンジニアリング"
  },
  {
    name: "株式会社ヒューマン・デザイン",
    industry: "その他",
    address: "福井県福井市",
    info: "人材派遣・人材紹介"
  },
  {
    name: "福井県医療生活協同組合",
    industry: "その他",
    address: "福井県福井市",
    info: "生活協同組合"
  },
  {
    name: "株式会社ながすぎ",
    industry: "小売",
    address: "福井県鯖江市",
    info: "食品関連の専門店"
  }
];

const search = document.getElementById("search");
const industry = document.getElementById("industry");
const list = document.getElementById("list");
const count = document.getElementById("count");

function showCompanies() {
  const keyword = search.value.trim().toLowerCase();
  const selected = industry.value;

  const filtered = companies.filter(company => {
    const text = (company.name + company.address + company.info).toLowerCase();
    return text.includes(keyword) && (!selected || company.industry === selected);
  });

  list.replaceChildren();
  count.textContent = filtered.length + "社の企業が見つかりました";

  filtered.forEach(company => {
    const card = document.createElement("div");
    card.className = "company";

    const button = document.createElement("button");
    button.type = "button";
    button.textContent = "＋ " + company.name;

    const detail = document.createElement("div");
    detail.className = "detail";
    detail.hidden = true;

    const address = document.createElement("p");
    address.textContent = "所在地：" + company.address;

    const type = document.createElement("p");
    type.textContent = "業種：" + company.industry;

    const info = document.createElement("p");
    info.textContent = "企業情報：" + company.info;

    detail.append(address, type, info);

    button.addEventListener("click", () => {
      detail.hidden = !detail.hidden;
      button.textContent = (detail.hidden ? "＋ " : "－ ") + company.name;
      button.setAttribute("aria-expanded", String(!detail.hidden));
    });

    card.append(button, detail);
    list.append(card);
  });
}

search.addEventListener("input", showCompanies);
industry.addEventListener("change", showCompanies);

showCompanies();
</script>
</body>
</html>

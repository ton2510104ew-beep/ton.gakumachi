<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>削除済み</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f7fb;
      color: #243548;
      font-family: "Yu Gothic", "Hiragino Sans", "Noto Sans JP", sans-serif;
    }
    .box {
      background: #fff;
      border: 1px solid #e1e7ef;
      border-radius: 18px;
      padding: 32px 40px;
      box-shadow: 0 8px 24px rgba(36, 53, 72, 0.08);
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 3vw, 2.4rem);
    }
    p {
      margin: 12px 0 0;
      color: #5d7186;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>削除しました</h1>
    <p>このページは現在表示を停止しています。</p>
  </div>
</body>
</html>

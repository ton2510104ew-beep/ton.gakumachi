<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d9f6f2">
  <meta name="description" content="AIとの対話を通して、自分に合った仕事や福井県内の企業を見つけましょう。">
  <title>福井で見つける企業・仕事 | ガクマチ</title>
  <style>
    :root{color-scheme:light;--dark:#164b59;--text:#244e57;--muted:#648187;--primary:#168f91;--line:rgba(91,187,184,.28);--glass:rgba(255,255,255,.72)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{min-height:100vh;margin:0;padding:30px 16px 48px;color:var(--text);font-family:"Yu Gothic","Hiragino Sans",sans-serif;line-height:1.7;background:radial-gradient(ellipse at 8% 8%,rgba(116,225,214,.42),transparent 30rem),linear-gradient(145deg,#effdfb,#e4f8fc 52%,#ddf8ef)}
    main{max-width:1000px;margin:auto}section{padding:28px;margin:0 0 22px;border:1px solid rgba(255,255,255,.9);border-radius:28px;background:var(--glass);box-shadow:0 12px 36px rgba(40,125,137,.1);backdrop-filter:blur(10px)}h1,h2,h3{color:var(--dark)}h1{margin:0 0 6px;font-size:clamp(28px,5vw,42px)}h2{margin-top:0}.muted,.notice{color:var(--muted)}.notice{font-size:12px}
    button,input{font:inherit}button{padding:10px 17px;border:0;border-radius:999px;color:white;background:linear-gradient(135deg,#62cec5,#168f91);font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #168f91;outline-offset:3px}input{min-width:0;padding:12px 14px;border:1px solid rgba(93,179,177,.45);border-radius:14px;background:white;color:var(--text)}
    .career-chat{max-width:780px;margin:16px auto 0;padding:18px;border:1px solid white;border-radius:22px;background:rgba(255,255,255,.58)}.chat-messages{display:grid;gap:12px;max-height:430px;min-height:100px;overflow:auto;padding:5px}.chat-message{max-width:90%;padding:11px 15px;border:1px solid rgba(255,255,255,.9);border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}.chat-message.assistant{justify-self:start;background:white}.chat-message.user{justify-self:end;color:white;background:#238f95}.chat-entry{display:flex;gap:8px;margin-top:12px}.chat-entry input{flex:1}.chat-results{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}.recommendations{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;padding:0;list-style:none}.recommendations li{padding:13px;border:1px solid var(--line);border-radius:14px;background:#fff}.recommendations a{color:var(--primary);font-weight:700}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.toolbar input{flex:1}.company-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.company-card{padding:16px;border:1px solid white;border-radius:18px;background:rgba(255,255,255,.8)}.company-card h3{margin:0 0 5px}.company-card p{margin:5px 0;color:var(--muted);font-size:14px}.company-card a{color:var(--primary)}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:600px){body{padding:14px 10px 30px}section{padding:20px 15px;border-radius:22px}.chat-entry{align-items:stretch}.chat-entry button{padding-inline:13px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
  </style>
</head>
<body>
<main>
  <section><h1>福井で見つける企業・仕事</h1><p>AIとの対話を通して、あなたに合う仕事や福井県内の企業を一緒に探します。</p></section>
  <section aria-labelledby="career-heading">
    <h2 id="career-heading">AIと一緒に、自分に合う仕事を見つけよう</h2>
    <p class="muted">好きなこと、大切にしたいこと、得意なことなどを自由に話してください。会話を重ねながら、仕事の方向性と企業候補をご提案します。</p>
    <div class="career-chat">
      <div id="chat-messages" class="chat-messages" role="log" aria-live="polite" aria-relevant="additions"></div>
      <form id="chat-form" class="chat-entry"><label class="visually-hidden" for="chat-input">メッセージ</label><input id="chat-input" maxlength="1500" placeholder="例：人の役に立てる仕事に興味があります" autocomplete="off" required><button id="send-button" type="submit">送信</button></form>
      <div id="chat-results" class="chat-results" hidden></div>
      <button id="chat-reset" type="button" hidden>相談をリセット</button>
    </div>
    <p class="notice">※AIの提案は職業選択の参考情報です。企業情報は登録データに基づいています。入力内容に氏名・住所などの個人情報を含めないでください。</p>
  </section>
  <section aria-labelledby="company-heading">
    <h2 id="company-heading">福井県の企業を探す</h2><p class="muted">企業名・住所・事業内容から検索できます。</p>
    <div class="toolbar"><label class="visually-hidden" for="company-search">企業を検索</label><input id="company-search" type="search" placeholder="企業名・住所・事業内容"><span id="company-count" role="status" aria-live="polite"></span></div>
    <div id="company-results" class="company-grid"></div>
  </section>
</main>
<script src="./companies.js"></script>
<script>
'use strict';
const companyList=Array.isArray(window.companies)?window.companies:(typeof companies!=='undefined'&&Array.isArray(companies)?companies:[]);
const messagesElement=document.getElementById('chat-messages');
const chatForm=document.getElementById('chat-form');
const chatInput=document.getElementById('chat-input');
const sendButton=document.getElementById('send-button');
const chatResults=document.getElementById('chat-results');
const resetButton=document.getElementById('chat-reset');
const history=[];
function addMessage(text,speaker){const item=document.createElement('div');item.className=`chat-message ${speaker}`;item.textContent=text;messagesElement.appendChild(item);messagesElement.scrollTop=messagesElement.scrollHeight;}
function showRecommendations(items){chatResults.replaceChildren();if(!Array.isArray(items)||!items.length){chatResults.hidden=true;return;}const heading=document.createElement('h3');heading.textContent='会話から見つかった福井県内の企業';chatResults.appendChild(heading);const list=document.createElement('ul');list.className='recommendations';items.forEach((item)=>{const company=companyList.find((entry)=>entry.name===item.name);if(!company)return;const li=document.createElement('li'),link=document.createElement('a'),info=document.createElement('p');link.href=`#company-${companyList.indexOf(company)}`;link.textContent=company.name;info.textContent=`${company.info||company.industry||'事業内容の情報はありません'}${company.address?` — ${company.address}`:''}`;li.append(link,info);list.appendChild(li);});if(!list.childElementCount){chatResults.hidden=true;return;}chatResults.appendChild(list);chatResults.hidden=false;}
chatForm.addEventListener('submit',async(event)=>{event.preventDefault();const text=chatInput.value.trim();if(!text||sendButton.disabled)return;addMessage(text,'user');history.push({role:'user',content:text});chatInput.value='';sendButton.disabled=true;chatInput.disabled=true;const thinking=document.createElement('div');thinking.className='chat-message assistant';thinking.setAttribute('role','status');thinking.textContent='あなたに合う仕事を考えています…';messagesElement.appendChild(thinking);messagesElement.scrollTop=messagesElement.scrollHeight;try{const response=await fetch('/.netlify/functions/career-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history,companies:companyList.map(({name,address,info,industry})=>({name,address,info,industry}))})});const data=await response.json();if(!response.ok)throw new Error(data.error||'AI相談に接続できませんでした。');thinking.remove();const reply=String(data.reply||'うまく回答を作れませんでした。もう一度お試しください。');addMessage(reply,'assistant');history.push({role:'assistant',content:reply});showRecommendations(data.recommendations);resetButton.hidden=false;}catch(error){thinking.remove();addMessage(`${error.message||'通信に失敗しました。'} 少し待ってからもう一度お試しください。`,'assistant');history.pop();}finally{sendButton.disabled=false;chatInput.disabled=false;chatInput.focus();}}
);
resetButton.addEventListener('click',()=>{history.length=0;messagesElement.replaceChildren();chatResults.replaceChildren();chatResults.hidden=true;resetButton.hidden=true;addMessage('こんにちは！好きなことや、仕事で大切にしたいことを教えてください。','assistant');chatInput.focus();});
const companySearch=document.getElementById('company-search'),companyResults=document.getElementById('company-results'),companyCount=document.getElementById('company-count');
function renderCompanies(){const query=companySearch.value.trim().toLocaleLowerCase();const found=companyList.map((company,index)=>({company,index})).filter(({company})=>`${company.name} ${company.address||''} ${company.info||''} ${company.industry||''}`.toLocaleLowerCase().includes(query));companyCount.textContent=`${found.length}社`;companyResults.replaceChildren();found.forEach(({company,index})=>{const card=document.createElement('article');card.className='company-card';card.id=`company-${index}`;const heading=document.createElement('h3'),address=document.createElement('p'),business=document.createElement('p');heading.textContent=company.name;address.textContent=`所在地：${company.address||'未登録'}`;business.textContent=`事業内容：${company.info||company.industry||'未登録'}`;card.append(heading,address,business);if(company.address){const map=document.createElement('a');map.href=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${company.name} ${company.address}`)}`;map.target='_blank';map.rel='noopener noreferrer';map.textContent='Google マップで見る';card.appendChild(map);}companyResults.appendChild(card);});}
companySearch.addEventListener('input',renderCompanies);renderCompanies();addMessage('こんにちは！好きなことや、仕事で大切にしたいことを教えてください。','assistant');
</script>
</body>
</html>

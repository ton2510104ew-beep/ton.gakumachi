<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d9f6f2">
  <title>福井で見つける企業・仕事 | ガクマチ</title>
  <style>
    :root { color-scheme: light; --dark:#164b59; --text:#244e57; --muted:#648187; --primary:#168f91; --line:rgba(91,187,184,.28); --glass:rgba(255,255,255,.57); }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { min-height:100vh; margin:0; padding:34px 18px 56px; color:var(--text); font-family:"Yu Gothic","Hiragino Sans",sans-serif; line-height:1.75; background:radial-gradient(ellipse at 8% 8%,rgba(116,225,214,.5),transparent 31rem),radial-gradient(ellipse at 92% 20%,rgba(150,224,242,.5),transparent 30rem),radial-gradient(ellipse at 50% 95%,rgba(151,238,210,.46),transparent 36rem),linear-gradient(145deg,#effdfb 0%,#e4f8fc 48%,#ddf8ef 100%); background-attachment:fixed; }
    main { max-width:1050px; margin:auto; }
    section { position:relative; isolation:isolate; overflow:hidden; padding:30px; margin-bottom:26px; border:1px solid rgba(255,255,255,.92); border-radius:34px; background:var(--glass); box-shadow:0 24px 60px rgba(40,125,137,.1),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35); backdrop-filter:blur(20px) saturate(145%); -webkit-backdrop-filter:blur(20px) saturate(145%); }
    section::before,section::after { position:absolute; z-index:-1; content:""; pointer-events:none; border:1px solid rgba(255,255,255,.68); border-radius:50%; background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.78),rgba(122,221,213,.14) 60%,transparent 72%); }
    section::before { width:220px; height:220px; top:-105px; right:-60px; }
    section::after { width:150px; height:150px; bottom:-90px; left:18%; opacity:.48; }
    section>* { position:relative; z-index:1; }
    h1,h2,h3 { color:var(--dark); }
    h1 { margin:0 0 8px; font-size:clamp(29px,5vw,44px); line-height:1.35; letter-spacing:.02em; }
    h2 { margin-top:0; }
    .muted,.map-message,.notice { color:var(--muted); }
    .filters { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; }
    label { display:grid; gap:7px; }
    input,select { width:100%; min-width:0; padding:13px 15px; border:1px solid rgba(93,179,177,.38); border-radius:18px; background:rgba(255,255,255,.72); color:var(--text); font:inherit; box-shadow:inset 0 2px 6px rgba(37,115,123,.04),0 5px 16px rgba(41,126,135,.04); backdrop-filter:blur(8px); }
    input::placeholder { color:#87a4a6; }
    :focus-visible { outline:3px solid rgba(22,143,145,.5); outline-offset:3px; }
    .company-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; margin-top:16px; }
    .company-card { min-width:0; padding:20px; border:1px solid rgba(255,255,255,.9); border-radius:28px; background:linear-gradient(145deg,rgba(255,255,255,.78),rgba(221,248,244,.66)); box-shadow:0 14px 34px rgba(49,132,140,.09),inset 0 1px 0 rgba(255,255,255,.95); backdrop-filter:blur(14px) saturate(135%); transition:transform .22s ease,box-shadow .22s ease; }
    .company-card:hover { transform:translateY(-3px); box-shadow:0 20px 38px rgba(49,132,140,.14),inset 0 1px 0 #fff; }
    .company-card h3 { margin:0 0 6px; }
    .company-card p { margin:5px 0; overflow-wrap:anywhere; color:var(--muted); font-size:14px; }
    button { padding:10px 17px; border:1px solid rgba(255,255,255,.55); border-radius:999px; color:white; background:linear-gradient(135deg,#73d9d0,#239d9c 72%,#16858d); font:inherit; font-weight:700; cursor:pointer; box-shadow:0 8px 18px rgba(25,137,143,.2),inset 0 1px 0 rgba(255,255,255,.4); transition:transform .18s ease,filter .18s ease,box-shadow .18s ease; }
    button:hover { filter:brightness(1.05); transform:translateY(-2px); box-shadow:0 11px 22px rgba(25,137,143,.25); }
    button:active { transform:translateY(0); }
    button:disabled { opacity:.6; cursor:not-allowed; }
    .company-map { margin-top:16px; padding-top:12px; border-top:1px solid var(--line); }
    .company-map h4 { margin:0; color:var(--dark); }
    .company-map iframe { display:block; width:100%; height:300px; margin-top:10px; border:1px solid var(--line); border-radius:20px; background:#e8f3f2; }
    .map-link { display:inline-block; margin-top:8px; color:var(--primary); font-weight:700; }
    .notice { font-size:12px; }
    .career-chat { max-width:760px; margin:16px auto 0; padding:20px; border:1px solid rgba(255,255,255,.94); border-radius:30px; background:linear-gradient(145deg,rgba(255,255,255,.66),rgba(223,248,246,.62)); box-shadow:inset 0 2px 14px rgba(43,138,145,.06),0 14px 30px rgba(52,136,145,.09); backdrop-filter:blur(18px) saturate(140%); }
    .chat-messages { display:grid; gap:12px; max-height:360px; overflow-y:auto; padding:5px; }
    .chat-message { max-width:88%; padding:12px 16px; border:1px solid rgba(255,255,255,.9); border-radius:22px; white-space:pre-wrap; overflow-wrap:anywhere; box-shadow:0 7px 16px rgba(42,119,130,.07); backdrop-filter:blur(10px); }
    .chat-message.assistant { justify-self:start; border-bottom-left-radius:8px; background:rgba(255,255,255,.78); }
    .chat-message.user { justify-self:end; border-bottom-right-radius:8px; color:#fff; background:linear-gradient(135deg,rgba(83,196,189,.96),rgba(35,143,149,.96)); }
    .chat-choices { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
    .chat-choices button { border-color:rgba(83,175,169,.35); color:var(--dark); background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(214,241,236,.88)); box-shadow:0 6px 14px rgba(36,124,132,.09); }
    .chat-entry { display:flex; gap:8px; margin-top:14px; }
    .chat-entry input { flex:1; }
    .chat-results { margin-top:18px; padding-top:14px; border-top:1px solid var(--line); }
    .chat-results h3 { margin-top:0; }
    .chat-results ul { padding-left:22px; }
    .chat-results li { margin:8px 0; }
    .chat-results a { color:var(--primary); font-weight:700; }
    .chat-reset { margin-top:14px; }
    .visually-hidden { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media(max-width:600px) { body { padding:16px 10px 36px; } section { padding:21px 16px; border-radius:28px; } .company-grid { grid-template-columns:1fr; } .company-card { border-radius:24px; } .company-map iframe { height:260px; } .career-chat { padding:14px; border-radius:25px; } .chat-entry { align-items:stretch; } .chat-message { max-width:94%; } }
    @media(prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } *,*::before,*::after { transition-duration:.01ms!important; } }
  </style>
</head>
<body>
<main>
  <section>
    <h1>福井で見つける企業・仕事</h1>
    <p>福井県内の企業を検索できます。企業を選ぶと、所在地を地図上に表示します。</p>
  </section>
  <section aria-labelledby="career-heading">
    <h2 id="career-heading">あなたに合う仕事を一緒に考えよう</h2>
    <p class="muted">少しだけ話してくれたら、あなたの考え方に合いそうな仕事や企業を提案します。</p>
    <div class="career-chat">
      <div id="chat-messages" class="chat-messages" role="log" aria-live="polite" aria-relevant="additions"></div>
      <div id="chat-choices" class="chat-choices" aria-label="回答を選択"></div>
      <form id="chat-form" class="chat-entry">
        <label for="chat-input" class="visually-hidden">自由に入力</label>
        <input id="chat-input" type="text" placeholder="自由に話してみてください（例：人と話すのが好き）" autocomplete="off" aria-label="自由に入力">
        <button type="submit">送信</button>
      </form>
      <div id="chat-results" class="chat-results" hidden></div>
      <button id="chat-reset" class="chat-reset" type="button" hidden>もう一度相談する</button>
    </div>
    <p class="notice">※この機能は、あなたの回答と福井県の企業データをもとに、候補を簡単に絞り込むものです。より自然な会話に近づけるには、将来生成AIのAPI連携を追加できます。</p>
  </section>
  <section aria-labelledby="company-heading">
    <h2 id="company-heading">福井県の企業を探す</h2>
    <p class="muted">企業名・住所・事業内容から検索してください。</p>
    <div class="filters">
      <label>企業を検索<input id="company-search" type="search" placeholder="企業名・住所・事業内容" aria-label="企業名・住所・事業内容で検索"></label>
      <label for="industry-filter">業種で絞り込む<select id="industry-filter" aria-label="業種で絞り込む"><option value="">すべての業種</option></select></label>
      <label for="company-select">地図に表示する企業<select id="company-select" aria-label="地図に表示する企業"></select></label>
    </div>
    <p id="company-count" role="status" aria-live="polite"></p>
    <div id="company-results" class="company-grid"></div>
    <p class="notice">※地図はGoogleマップの住所検索結果を表示します。住所によっては会社の正確な位置が特定できない場合があります。</p>
  </section>
</main>
<script src="./companies.js"></script>
<script>
  'use strict';
  const companyList = Array.isArray(companies) ? companies : [];
  const select = document.getElementById('company-select');
  const search = document.getElementById('company-search');
  const industryFilter = document.getElementById('industry-filter');
  const resultElement = document.getElementById('company-results');
  const countElement = document.getElementById('company-count');
  let activeIndex = null;

  const chatMessages = document.getElementById('chat-messages');
  const chatChoices = document.getElementById('chat-choices');
  const chatForm = document.getElementById('chat-form');
  const chatInput = document.getElementById('chat-input');
  const chatResults = document.getElementById('chat-results');
  const chatReset = document.getElementById('chat-reset');
  const careerQuestions = [
    { text: 'まず、あなたが「楽しい」と感じる仕事のタイプを選んでください。', choices: ['頭を使って考える仕事', '手を動かして作る仕事', '人と関わる仕事', '数字や情報を扱う仕事', '地域や社会に役立つ仕事'] },
    { text: '次に、こんなときにやる気が出ますか？', choices: ['新しいアイデアを考えるとき', 'ものづくりをしているとき', '人の役に立てているとき', '予定を立てて進めるとき', '地域に貢献しているとき'] },
    { text: '最後に、働くうえで大事にしたいことはどれですか？', choices: ['安定した仕事', '成長できる環境', '自分の考えを活かせる', '人間関係が良い', '社会に貢献したい'] }
  ];
  let careerAnswers = [];
  let careerStep = 0;

  function addChatMessage(text, speaker) {
    const message = document.createElement('div');
    message.className = `chat-message ${speaker}`;
    message.textContent = text;
    chatMessages.appendChild(message);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function showCareerQuestion() {
    if (careerStep >= careerQuestions.length) return showCareerRecommendations();
    const question = careerQuestions[careerStep];
    addChatMessage(question.text, 'assistant');
    chatChoices.replaceChildren();
    question.choices.forEach((choice) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = choice;
      button.addEventListener('click', () => submitCareerAnswer(choice));
      chatChoices.appendChild(button);
    });
  }

  function submitCareerAnswer(answer) {
    const cleanAnswer = String(answer || '').trim();
    if (!cleanAnswer || careerStep >= careerQuestions.length) return;
    careerAnswers.push(cleanAnswer);
    addChatMessage(cleanAnswer, 'user');
    careerStep += 1;
    chatInput.value = '';
    chatChoices.replaceChildren();
    showCareerQuestion();
  }

  function getCareerMatches() {
    const answerText = careerAnswers.join(' ').toLocaleLowerCase();
    const interestMap = [
      { keywords: ['考える', '頭', 'アイデア', '新しい', '分析', '情報', 'it', 'プログラミング', 'システム'], industries: ['ソフトウェア・情報処理', 'IT・ロボット代筆サービス・通販', '建設コンサルタント'] },
      { keywords: ['作る', '手を動かす', 'ものづくり', '機械', '工夫', '技術', '設計'], industries: ['精密機器', '鉱業・金属製品・鉄鋼', '半導体・電子・電気機器', '金属製品', '設備工事'] },
      { keywords: ['人', '助ける', '支える', '医療', '社会', '地域', '関わる', '接する'], industries: ['医療用機器・医療関連', '化粧品・医薬品', '化学・医療関連', '人材派遣・人材紹介', '生活協同組合'] },
      { keywords: ['数字', '計画', '安定', 'ビジネス', '金融', '管理'], industries: ['銀行', '信用金庫・金融サービス', '総合商社', '専門商社', '物流・倉庫'] },
      { keywords: ['地域', '社会', '環境', '自然', 'エネルギー', '貢献'], industries: ['環境・リサイクル', '水処理・環境関連サービス', '電力・ガス・エネルギー', '建設・土木', '地域経済・企業支援'] },
      { keywords: ['販売', '食', '接客', '商売', 'お客様'], industries: ['食品', '流通・チェーンストア', '食品関連の専門店', '専門店（食品関連）', '通信販売・ネット販売'] }
    ];
    const ranked = new Map();
    interestMap.forEach(({ keywords, industries }) => {
      const points = keywords.reduce((total, word) => total + (answerText.includes(word) ? 2 : 0), 0);
      if (points > 0) industries.forEach((industry) => ranked.set(industry, (ranked.get(industry) || 0) + points));
    });
    const chosenIndustries = [...ranked.entries()].sort((a, b) => b[1] - a[1]).map(([industry]) => industry);
    const matches = companyList
      .map((company, index) => ({ company, index, score: chosenIndustries.findIndex((industry) => `${company.info || ''} ${company.industry || ''}`.includes(industry)) }))
      .filter(({ score }) => score >= 0)
      .sort((a, b) => a.score - b.score)
      .slice(0, 5);
    return { chosenIndustries, matches };
  }

  function showCareerRecommendations() {
    chatChoices.replaceChildren();
    chatInput.disabled = true;
    chatForm.querySelector('button').disabled = true;
    addChatMessage('ありがとうございます。あなたの回答をもとに、少し合いそうな仕事の方向を整理してみました。', 'assistant');
    const { chosenIndustries, matches } = getCareerMatches();
    const heading = document.createElement('h3');
    heading.textContent = 'おすすめの働き方・企業';
    chatResults.replaceChildren(heading);
    if (chosenIndustries.length) {
      const industryText = document.createElement('p');
      industryText.textContent = `あなたに合いそうな方向：${chosenIndustries.slice(0, 4).join('、')}`;
      chatResults.appendChild(industryText);
    }
    if (matches.length) {
      const list = document.createElement('ul');
      matches.forEach(({ company, index }) => {
        const item = document.createElement('li');
        const link = document.createElement('a');
        link.href = '#company-heading';
        link.textContent = company.name;
        link.addEventListener('click', () => {
          search.value = company.name;
          industryFilter.value = '';
          activeIndex = index;
          select.value = String(index);
          renderCompanies();
        });
        item.append(link, document.createTextNode(` — ${company.info || company.industry || '事業内容は未登録です'}`));
        list.appendChild(item);
      });
      chatResults.appendChild(list);
      const hint = document.createElement('p');
      hint.className = 'notice';
      hint.textContent = '気になる企業を選ぶと、企業一覧の詳細と地図を確認できます。候補は参考としてご利用ください。';
      chatResults.appendChild(hint);
    } else {
      const fallback = document.createElement('p');
      fallback.textContent = '少しだけ方向が見えてきました。企業一覧で「IT」「建設」「医療」などを検索して、自分に合う働き方を探してみてください。';
      chatResults.appendChild(fallback);
    }
    chatResults.hidden = false;
    chatReset.hidden = false;
  }

  chatForm.addEventListener('submit', (event) => {
    event.preventDefault();
    const text = chatInput.value.trim();
    if (text) submitCareerAnswer(text);
  });
  chatReset.addEventListener('click', () => {
    careerAnswers = [];
    careerStep = 0;
    chatMessages.replaceChildren();
    chatResults.replaceChildren();
    chatResults.hidden = true;
    chatReset.hidden = true;
    chatInput.disabled = false;
    chatForm.querySelector('button').disabled = false;
    showCareerQuestion();
  });
  showCareerQuestion();

  companyList.forEach((company, index) => {
    const option = document.createElement('option');
    option.value = String(index);
    option.textContent = company.name;
    select.appendChild(option);
  });
  const industryValues = [...new Set(companyList.flatMap((company) => [company.industry, company.info].filter(Boolean)))]
    .filter((value) => value !== 'その他')
    .sort((a, b) => a.localeCompare(b, 'ja'));
  industryValues.forEach((industry) => {
    const option = document.createElement('option');
    option.value = industry;
    option.textContent = industry;
    industryFilter.appendChild(option);
  });

  function addMapToCard(card, company) {
    const address = (company.address || '').trim();
    const mapSection = document.createElement('div');
    mapSection.className = 'company-map';
    mapSection.setAttribute('aria-label', `${company.name}の所在地マップ`);
    const heading = document.createElement('h4');
    heading.textContent = '企業所在地マップ';
    const addressElement = document.createElement('p');
    addressElement.textContent = `所在地：${address || '住所が登録されていません。'}`;
    mapSection.append(heading, addressElement);
    if (!address) {
      const message = document.createElement('p');
      message.className = 'map-message';
      message.setAttribute('role', 'status');
      message.textContent = '住所が登録されていないため、地図を検索できません。';
      mapSection.appendChild(message);
      card.appendChild(mapSection);
      return;
    }
    const encodedQuery = encodeURIComponent(`${company.name} ${address}`);
    const message = document.createElement('p');
    message.className = 'map-message';
    message.setAttribute('role', 'status');
    message.textContent = 'Googleマップで住所を検索しています。表示に時間がかかる場合があります。';
    const mapFrame = document.createElement('iframe');
    mapFrame.title = `${company.name}の所在地地図`;
    mapFrame.src = `https://maps.google.com/maps?q=${encodedQuery}&output=embed`;
    mapFrame.loading = 'lazy';
    mapFrame.referrerPolicy = 'no-referrer-when-downgrade';
    mapFrame.allowFullscreen = true;
    const mapLink = document.createElement('a');
    mapLink.className = 'map-link';
    mapLink.href = `https://www.google.com/maps/search/?api=1&query=${encodedQuery}`;
    mapLink.target = '_blank';
    mapLink.rel = 'noopener noreferrer';
    mapLink.textContent = 'Google マップで開く';
    mapSection.append(message, mapFrame, mapLink);
    card.appendChild(mapSection);
  }

  function renderCompanies() {
    const keyword = search.value.trim().toLocaleLowerCase();
    const selectedIndustry = industryFilter.value;
    const matched = companyList.map((company, index) => ({ company, index })).filter(({ company }) => {
      const searchText = `${company.name} ${company.address || ''} ${company.info || ''} ${company.industry || ''}`.toLocaleLowerCase();
      const keywordMatch = !keyword || searchText.includes(keyword);
      const industryMatch = !selectedIndustry || `${company.industry || ''} ${company.info || ''}`.includes(selectedIndustry);
      return keywordMatch && industryMatch;
    });
    resultElement.replaceChildren();
    countElement.textContent = `${matched.length}社が見つかりました。`;
    matched.forEach(({ company, index }) => {
      const card = document.createElement('article');
      card.className = 'company-card';
      const title = document.createElement('h3');
      title.textContent = company.name;
      const address = document.createElement('p');
      address.textContent = `所在地：${company.address || '登録なし'}`;
      const info = document.createElement('p');
      info.textContent = `事業内容：${company.info || company.industry || '登録なし'}`;
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = activeIndex === index ? '地図を表示中' : '地図で見る';
      button.setAttribute('aria-expanded', String(activeIndex === index));
      button.addEventListener('click', () => {
        activeIndex = index;
        select.value = String(index);
        renderCompanies();
        resultElement.querySelector(`[data-company-index="${index}"] .company-map`)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
      card.dataset.companyIndex = String(index);
      card.append(title, address, info, button);
      if (activeIndex === index) addMapToCard(card, company);
      resultElement.appendChild(card);
    });
  }

  select.addEventListener('change', () => {
    activeIndex = Number(select.value);
    renderCompanies();
    resultElement.querySelector(`[data-company-index="${activeIndex}"] .company-map`)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
  search.addEventListener('input', renderCompanies);
  industryFilter.addEventListener('change', renderCompanies);
  renderCompanies();
</script>
</body>
</html>

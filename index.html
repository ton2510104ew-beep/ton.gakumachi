<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6dce7">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700&display=swap" rel="stylesheet">
  <title>福井で見つける企業・仕事 | ガクマチ</title>
  <style>
    :root { color-scheme:light; --dark:#65394e; --text:#5d4652; --muted:#886d79; --primary:#c45f88; --line:rgba(143,145,153,.48); --glass:rgba(255,249,252,.86); --silver:#aeb0b8; --silver-light:#f2f3f5; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { min-height:100vh; margin:0; padding:34px 18px 56px; color:var(--text); font-family:"M PLUS 1p","Hiragino Sans","Yu Gothic",sans-serif; line-height:1.75; }
    main { max-width:1050px; margin:auto; }
    section { padding:30px; margin-bottom:22px; border:1px solid var(--line); border-radius:12px; background:var(--glass); }
    h1,h2,h3,h4 { color:var(--dark); }
    h1 { margin:0; font-size:clamp(29px,5vw,44px); }
    h2 { margin-top:0; }
    .hero-heading-row { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    .muted { color:var(--muted); }
    button,.map-link { padding:10px 17px; border:1px solid transparent; border-radius:6px; color:white; background:linear-gradient(#ce7198,#b9517c); cursor:pointer; }
    button:disabled { opacity:.6; cursor:not-allowed; }
    .chat-messages { display:grid; gap:10px; max-height:360px; overflow-y:auto; }
    .chat-message { max-width:88%; padding:11px 15px; border:1px solid rgba(158,160,169,.35); border-radius:8px; white-space:pre-wrap; overflow-wrap:anywhere; }
    .chat-message.assistant { justify-self:start; background:white; }
    .chat-message.user { justify-self:end; color:white; background:#b9517c; }
    .chat-choices { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
    .chat-choices button { color:var(--dark); background:white; border:1px solid var(--line); }
    .chat-entry { display:flex; gap:8px; margin-top:14px; }
    .chat-entry input { flex:1; min-width:0; padding:13px 15px; border:1px solid var(--line); border-radius:6px; }
    .chat-results { margin-top:18px; padding-top:14px; border-top:1px solid var(--line); }
    .chat-recommendation-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; margin-top:12px; }
    .chat-company-card { position:relative; min-width:0; padding:15px; border:1px solid var(--line); border-radius:8px; background:white; }
    .chat-company-card h4 { margin:0 0 6px; }
    .chat-company-card p { color:var(--muted); font-size:14px; margin:5px 0; }
    .match-reasons { color:#7b3b58 !important; }
    .map-link { display:inline-flex; margin-top:9px; text-decoration:none; }
  </style>
</head>
<body>
<main>
  <section>
    <h1>福井で見つける企業・仕事</h1>
  </section>
  <section aria-labelledby="career-heading">
    <h2 id="career-heading">あなたに合う仕事を一緒に考えよう</h2>
    <p class="muted">少しだけ話してくれたら、あなたの考え方に合いそうな仕事や企業を提案します。</p>
    <div class="career-chat">
      <div id="chat-messages" class="chat-messages" role="log" aria-live="polite"></div>
      <div id="chat-choices" class="chat-choices" aria-label="回答を選択"></div>
      <form id="chat-form" class="chat-entry">
        <label class="visually-hidden" for="chat-input">希望を入力</label>
        <input id="chat-input" type="text" placeholder="希望を入力" autocomplete="off">
        <button type="submit">送信</button>
      </form>
      <div id="chat-results" class="chat-results" hidden></div>
      <button id="chat-reset" type="button" hidden>もう一度相談する</button>
    </div>
  </section>
</main>
<script src="./companies.js"></script>
<script>
'use strict';
const companyList=Array.isArray(companies)?companies:[];
const chatMessages=document.getElementById('chat-messages'),chatChoices=document.getElementById('chat-choices'),chatForm=document.getElementById('chat-form'),chatInput=document.getElementById('chat-input'),chatResults=document.getElementById('chat-results'),chatReset=document.getElementById('chat-reset');

const careerQuestions=[
  {text:'まず、あなたが「楽しい」と感じる仕事のタイプを選んでください。',choices:['頭を使って考える仕事','手を動かして作る仕事','人を支える仕事','人と関わる仕事','販売や接客をする仕事']},
  {text:'職場で大切にしたいことは何ですか？',choices:['地域や社会に貢献する','安定して続けられる','挑戦や成長がある','チームで協力する']},
  {text:'得意なことや興味に近いものは？',choices:['自然・環境','IT・ものづくり','人・医療・福祉','販売・接客']}
];
let careerAnswers=[],careerStep=0;

function addChatMessage(text,speaker){
  const message=document.createElement('div');
  message.className=`chat-message ${speaker}`;
  message.textContent=text;
  chatMessages.appendChild(message);
  chatMessages.scrollTop=chatMessages.scrollHeight;
}
function showCareerQuestion(){
  if(careerStep>=careerQuestions.length)return showCareerRecommendations();
  const question=careerQuestions[careerStep];
  addChatMessage(question.text,'assistant');
  chatChoices.replaceChildren();
  (question.choices||[]).forEach(choice=>{
    const button=document.createElement('button');
    button.type='button';button.textContent=choice;
    button.addEventListener('click',()=>submitCareerAnswer(choice));
    chatChoices.appendChild(button);
  });
  chatInput.disabled=false;
}
function submitCareerAnswer(answer){
  const clean=String(answer||'').trim();
  if(!clean||careerStep>=careerQuestions.length)return;
  careerAnswers.push(clean);
  addChatMessage(clean,'user');
  careerStep++;
  chatChoices.replaceChildren();
  setTimeout(showCareerQuestion,180);
}

const municipalityNames=['福井市','敦賀市','小浜市','大野市','勝山市','鯖江市','あわら市','越前市','坂井市','越前町','美浜町','高浜町','おおい町','若狭町','池田町','南越前町','永平寺町'];
const careerProfiles=[
  {name:'考える・IT',positive:/考える|アイデア|分析|情報|it|ict|システム|ソフトウェア|研究|設計/,negative:/接客|販売|人と多く|座りたくない/},
  {name:'ものづくり',positive:/作る|ものづくり|機械|技術|設計|製造|精密|金属|電子|建設/,negative:/デスクワーク|事務|営業/},
  {name:'人・医療・福祉',positive:/人を支える|人と関わる|人・医療|医療|福祉|介護|保健|人材/,negative:/一人|一人で|人と関わらない/},
  {name:'自然・環境',positive:/自然|環境|エネルギー|リサイクル|電力|ガス|地域|社会/,negative:/オフィス|事務/},
  {name:'販売・接客',positive:/販売|接客|商売|流通|販売・接客|食品|飲食|小売/,negative:/人と関わらない|外来を避ける/},
  {name:'安定・金融',positive:/安定|数字|計画|金融|銀行|保険|管理|物流|倉庫/,negative:/挑戦|変化が多い/}
];

function scoreRecommendedCompanies(){
  const text=careerAnswers.join(' ').toLocaleLowerCase();
  const preferredMunicipalities=municipalityNames.filter(name=>text.includes(name));
  const avoidTerms=['重い作業','重労働','接客','営業','夜勤','人と関わる','人と接する','一人で','屋外','デスクワーク','事務'];

  return companyList.map((company,index)=>{
    const description=`${company.name||''} ${company.industry||''} ${company.info||''} ${company.address||''}`.toLocaleLowerCase();
    let score=0;const reasons=[];

    careerProfiles.forEach(profile=>{
      if(profile.positive.test(text)&&profile.positive.test(description)){
        score+=3;reasons.push(profile.name);
      }
      if(profile.negative.test(text)&&profile.negative.test(description))score-=4;
    });

    avoidTerms.forEach(term=>{
      if(text.includes(term)&&term==='接客'&&/販売|接客|飲食|レストラン|小売/.test(description))score-=3;
      if(text.includes(term)&&term==='営業'&&/営業|販売/.test(description))score-=3;
      if(text.includes(term)&&term==='デスクワーク'&&/事務|情報処理|ソフトウェア|システム/.test(description))score-=2;
    });

    if(preferredMunicipalities.length){
      if(preferredMunicipalities.some(name=>description.includes(name))){score+=5;reasons.push('希望勤務地');}
      else score-=2;
    }

    const uniqueReasons=[...new Set(reasons)].slice(0,3);
    return {company,index,score,reasons:uniqueReasons};
  }).sort((a,b)=>b.score-a.score||a.index-b.index).slice(0,6);
}

function createRecommendationCard(result){
  const company=result.company;
  const card=document.createElement('article');
  card.className='chat-company-card';
  const name=document.createElement('h4');name.textContent=company.name||'企業名未登録';
  const industry=document.createElement('p');industry.textContent=`業種：${company.info||company.industry||'未登録'}`;
  const address=document.createElement('p');address.textContent=company.address||'住所情報なし';
  card.append(name,industry,address);
  if(result.reasons.length){
    const reason=document.createElement('p');reason.className='match-reasons';reason.textContent=`おすすめ理由：${result.reasons.join('・')}`;card.appendChild(reason);
  }
  if(company.address){
    const map=document.createElement('a');map.className='map-link';map.href=`./map.html?name=${encodeURIComponent(company.name||'')}`;map.textContent='地図を見る';card.appendChild(map);
  }
  return card;
}

function showCareerRecommendations(){
  chatChoices.replaceChildren();
  chatInput.disabled=true;chatForm.querySelector('button').disabled=true;
  addChatMessage('回答をもとに、希望との一致度で企業を並べます。','assistant');
  const recommendations=scoreRecommendedCompanies();
  chatResults.hidden=false;chatResults.replaceChildren();
  const title=document.createElement('h3');title.textContent='おすすめの企業';chatResults.appendChild(title);

  if(!recommendations.length||recommendations.every(item=>item.score<=0)){
    const noMatch=document.createElement('p');noMatch.textContent='今の回答に合う企業データが十分に見つかりませんでした。回答を具体的にしたり、別の希望で再度相談してください。';chatResults.appendChild(noMatch);
  }else{
    const grid=document.createElement('div');grid.className='chat-recommendation-grid';
    recommendations.filter(item=>item.score>0).forEach(item=>grid.appendChild(createRecommendationCard(item)));
    chatResults.appendChild(grid);
  }
  chatReset.hidden=false;
}

chatForm.addEventListener('submit',event=>{event.preventDefault();const text=chatInput.value.trim();if(text&&careerStep<careerQuestions.length)submitCareerAnswer(text);chatInput.value='';});
chatReset.addEventListener('click',()=>{careerAnswers=[];careerStep=0;chatMessages.replaceChildren();chatResults.replaceChildren();chatResults.hidden=true;chatReset.hidden=true;chatInput.disabled=false;chatForm.querySelector('button').disabled=false;showCareerQuestion();});
showCareerQuestion();
</script>
<script src="./career-questions-extra.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>福井で見つける企業・仕事 | ガクマチ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root { color-scheme: light; --bg: #eefcf9; --dark: #1a4d5a; --text: #234c54; --muted: #5d7b7d; --primary: #2a8a8a; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; padding: 28px 16px 50px; color: var(--text); font-family: "Yu Gothic", "Hiragino Sans", sans-serif; background: linear-gradient(135deg, var(--bg), #e9f9fb, #dff8f1); line-height: 1.7; }
    main { max-width: 1050px; margin: auto; }
    section { padding: 24px; margin-bottom: 22px; background: rgba(255,255,255,.9); border: 1px solid #fff; border-radius: 22px; box-shadow: 0 12px 28px rgba(55,128,133,.1); }
    h1, h2, h3 { color: var(--dark); }
    h1 { margin-top: 0; font-size: clamp(28px, 5vw, 42px); }
    .muted, #map-message { color: var(--muted); }
    .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
    input, select { width: 100%; min-width: 0; padding: 12px; border: 1px solid #a8dcd5; border-radius: 12px; background: #fff; color: var(--text); font: inherit; }
    :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
    .company-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-top: 16px; }
    .company-card { padding: 16px; border: 1px solid #b6e2dc; border-radius: 16px; background: linear-gradient(135deg, #fff, #e9faf6); }
    .company-card h3 { margin: 0 0 4px; }
    .company-card p { margin: 5px 0; overflow-wrap: anywhere; color: var(--muted); font-size: 14px; }
    button { padding: 9px 14px; border: 0; border-radius: 22px; color: white; background: linear-gradient(135deg, #61c6c0, #2a8a8a); font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { filter: brightness(.96); }
    #map { width: 100%; height: 420px; margin-top: 14px; border-radius: 14px; background: #e8f3f2; }
    .notice { color: var(--muted); font-size: 12px; }
    @media (max-width: 600px) { body { padding: 14px 10px 32px; } section { padding: 18px 14px; } #map { height: 340px; } }
  </style>
</head>
<body>
<main>
  <section>
    <h1>福井で見つける企業・仕事 🌷</h1>
    <p>福井県内の企業を検索できます。企業を選ぶと、所在地を地図上に表示します。</p>
  </section>
  <section aria-labelledby="company-heading">
    <h2 id="company-heading">🏢 福井県の企業を探す</h2>
    <p class="muted">企業名・住所・事業内容から検索してください。</p>
    <div class="filters">
      <label>企業を検索<input id="company-search" type="search" placeholder="企業名・住所・事業内容" aria-label="企業名・住所・事業内容で検索"></label>
      <label for="company-select">地図に表示する企業<select id="company-select" aria-label="地図に表示する企業"></select></label>
    </div>
    <p id="company-count" role="status" aria-live="polite"></p>
    <div id="company-results" class="company-grid"></div>
  </section>
  <section aria-labelledby="map-heading">
    <h2 id="map-heading">📍 企業所在地マップ</h2>
    <p id="map-address" class="muted"></p>
    <p id="map-message" role="status" aria-live="polite">企業を選択してください。</p>
    <div id="map" aria-label="選択した企業の所在地地図"></div>
    <p class="notice">※地図上の位置は住所から自動で調べています。町・丁目の代表地点となる場合があるため、正確な場所は企業にご確認ください。</p>
  </section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="./companies.js"></script>
<script>
  'use strict';
  const companyList = Array.isArray(companies) ? companies : [];
  const select = document.getElementById('company-select');
  const search = document.getElementById('company-search');
  const resultElement = document.getElementById('company-results');
  const countElement = document.getElementById('company-count');
  const addressElement = document.getElementById('map-address');
  const messageElement = document.getElementById('map-message');
  let requestNumber = 0;

  const map = L.map('map').setView([35.645, 136.055], 9);
  const markerLayer = L.layerGroup().addTo(map);
  L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html">地理院タイル</a>'
  }).addTo(map);

  companyList.forEach((company, index) => {
    const option = document.createElement('option');
    option.value = String(index);
    option.textContent = company.name;
    select.appendChild(option);
  });

  async function showCompany(index) {
    const company = companyList[index];
    if (!company) return;
    const currentRequest = ++requestNumber;
    markerLayer.clearLayers();
    addressElement.textContent = `所在地：${company.address}`;
    messageElement.textContent = '住所から位置を調べています…';
    if (!company.address || !company.address.trim()) {
      messageElement.textContent = '住所が登録されていません。';
      return;
    }
    try {
      const { normalize } = await import('https://esm.sh/@geolonia/normalize-japanese-addresses@3.1.3');
      const result = await normalize(company.address, { level: 8 });
      if (currentRequest !== requestNumber) return;
      const point = result.point;
      if (!point || point.level < 3) {
        messageElement.textContent = 'この住所の位置を調べられませんでした。住所をご確認ください。';
        return;
      }
      const position = [point.lat, point.lng];
      map.setView(position, 16);
      L.marker(position).addTo(markerLayer).bindPopup(company.name).openPopup();
      map.invalidateSize();
      messageElement.textContent = point.level === 8
        ? '住所から調べた位置です。正確な場所は企業にご確認ください。'
        : '町・丁目の代表地点です。正確な場所とは異なる場合があります。';
    } catch (error) {
      if (currentRequest !== requestNumber) return;
      messageElement.textContent = '地図を表示できませんでした。通信環境を確認してください。';
      console.error(error);
    }
  }

  function renderCompanies() {
    const keyword = search.value.trim().toLocaleLowerCase();
    const matched = companyList.map((company, index) => ({ company, index })).filter(({ company }) =>
      `${company.name} ${company.address} ${company.info}`.toLocaleLowerCase().includes(keyword)
    );
    resultElement.replaceChildren();
    countElement.textContent = `${matched.length}社が見つかりました。`;
    matched.forEach(({ company, index }) => {
      const card = document.createElement('article');
      card.className = 'company-card';
      const title = document.createElement('h3');
      title.textContent = company.name;
      const address = document.createElement('p');
      address.textContent = `所在地：${company.address}`;
      const info = document.createElement('p');
      info.textContent = `事業内容：${company.info}`;
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = '地図で見る';
      button.addEventListener('click', () => {
        select.value = String(index);
        showCompany(index);
        document.getElementById('map-heading').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      card.append(title, address, info, button);
      resultElement.appendChild(card);
    });
  }

  select.addEventListener('change', () => showCompany(Number(select.value)));
  search.addEventListener('input', renderCompanies);
  renderCompanies();
  if (companyList.length) showCompany(0);
</script>
</body>
</html>

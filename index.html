<meta name="viewport" content="width=device-width, initial-scale=1">
<title>福井県 企業情報一覧</title>
<style>
:root {
  --bg-1: #edf6ff;
  --bg-2: #f8f2eb;
  --bg-3: #fffdf9;
  --primary: #1e5d8d;
  --primary-dark: #163f60;
  --primary-soft: #eaf3ff;
  --accent: #f0a35d;
  --accent-soft: #fff1df;
  --card: rgba(255, 255, 255, 0.9);
  --card-strong: #ffffff;
  --text: #243548;
  --muted: #5d7186;
  --line: #deebf5;
  --shadow: rgba(20, 46, 68, 0.12);
  --success: #3f8a7a;
}

* { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: "Yu Gothic", "Hiragino Sans", "Noto Sans JP", sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at top left, rgba(30, 93, 141, 0.12), transparent 32%),
    radial-gradient(circle at bottom right, rgba(240, 163, 93, 0.15), transparent 28%),
    linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
  min-height: 100vh;
  padding: 32px 18px 48px;
}

main {
  max-width: 980px;
  margin: 0 auto;
}

.hero {
  background: rgba(255, 255, 255, 0.6);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(222, 235, 245, 0.9);
  border-radius: 28px;
  box-shadow: 0 18px 42px rgba(29, 59, 82, 0.08);
  padding: 26px 24px 18px;
  margin-bottom: 22px;
}

.hero-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  flex-wrap: wrap;
}

.kicker {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
  border-radius: 999px;
  background: var(--primary-soft);
  color: var(--primary);
  font-size: 0.76rem;
  font-weight: 700;
  letter-spacing: 0.04em;
}

.kicker::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 5px rgba(240, 163, 93, 0.12);
}

h1 {
  margin: 14px 0 10px;
  color: var(--primary-dark);
  font-size: clamp(2rem, 3.2vw, 2.9rem);
  letter-spacing: 0.04em;
  line-height: 1.15;
}

.hero p {
  margin: 0;
  color: var(--muted);
  font-size: 1rem;
  line-height: 1.7;
}

.toolbar {
  margin-top: 22px;
  display: grid;
  grid-template-columns: minmax(0, 3fr) minmax(200px, 1.2fr);
  gap: 16px;
  align-items: center;
}

.field {
  position: relative;
}

input, select {
  width: 100%;
  padding: 15px 16px;
  font-size: 16px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: rgba(255,255,255,0.9);
  color: var(--text);
  box-shadow: inset 0 1px 2px rgba(15, 35, 51, 0.04);
  transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
}

select {
  appearance: none;
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted) 50%),
    linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position:
    calc(100% - 22px) calc(50% - 2px),
    calc(100% - 16px) calc(50% - 2px);
  background-size: 6px 6px, 6px 6px;
  background-repeat: no-repeat;
  padding-right: 42px;
}

input:focus, select:focus {
  outline: none;
  border-color: rgba(30, 93, 141, 0.6);
  box-shadow: 0 0 0 4px rgba(30, 93, 141, 0.12);
}

#count {
  margin: 20px 4px 14px;
  color: var(--primary-dark);
  font-size: 0.98rem;
  font-weight: 700;
  letter-spacing: 0.03em;
}

#count strong {
  color: var(--primary);
  font-size: 1.15em;
}

#list {
  display: grid;
  gap: 16px;
}

.company {
  position: relative;
  background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.96), rgba(233, 242, 255, 0.92) 32%, rgba(204, 225, 244, 0.88) 100%);
  border: 2px solid rgba(122, 170, 212, 0.5);
  border-radius: 999px;
  box-shadow:
    inset 0 2px 10px rgba(255,255,255,0.75),
    inset 0 -10px 16px rgba(168, 202, 235, 0.18),
    0 10px 22px rgba(22, 55, 77, 0.08);
  overflow: hidden;
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}

.company::before {
  content: "";
  position: absolute;
  width: 24%;
  height: 44%;
  top: 10%;
  left: 10%;
  border-radius: 50%;
  background: rgba(255,255,255,0.35);
  filter: blur(4px);
  pointer-events: none;
}

.company:hover {
  transform: translateY(-2px);
  border-color: rgba(30, 93, 141, 0.28);
  box-shadow:
    inset 0 2px 10px rgba(255,255,255,0.78),
    inset 0 -8px 12px rgba(168, 202, 235, 0.16),
    0 18px 32px rgba(22, 55, 77, 0.12);
}

.company.is-open {
  border-color: rgba(30, 93, 141, 0.38);
  box-shadow:
    inset 0 2px 10px rgba(255,255,255,0.78),
    inset 0 -8px 12px rgba(168, 202, 235, 0.22),
    0 18px 32px rgba(22, 55, 77, 0.12);
}

.company button {
  position: relative;
  z-index: 1;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 18px 20px 16px;
  background: transparent;
  border: none;
  color: var(--primary-dark);
  font-size: 1.06rem;
  font-weight: 800;
  text-align: left;
  cursor: pointer;
  letter-spacing: 0.01em;
  border-radius: 999px;
  transition: background-color 0.2s ease, transform 0.12s ease;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}

.company button:active {
  transform: scale(0.995);
}

.company button:focus-visible {
  outline: 3px solid rgba(30, 93, 141, 0.2);
  outline-offset: 2px;
}

.company button span:first-child {
  display: inline-flex;
  align-items: center;
  gap: 10px;
}

.company button .mark {
  width: 32px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary-soft), rgba(31, 93, 140, 0.12));
  color: var(--primary);
  font-size: 1.15rem;
  font-weight: 700;
  box-shadow: inset 0 1px 3px rgba(255,255,255,0.9);
}

.company button .chevron {
  width: 36px;
  height: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(30, 93, 141, 0.06);
  color: var(--primary);
  font-size: 1.3rem;
  transition: transform 0.2s ease, background 0.2s ease;
}

.company.is-open .chevron {
  transform: rotate(180deg);
}

.company button:hover .chevron {
  background: rgba(30, 93, 141, 0.1);
}

.detail {
  display: block;
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  padding: 0 18px;
  border-top: 0 solid rgba(222, 235, 245, 0.9);
  background: linear-gradient(180deg, rgba(240,163,93,0.05), rgba(255,255,255,0.12));
  transition: max-height 0.32s ease, opacity 0.22s ease, padding 0.22s ease, border-top-width 0.22s ease;
}

.company.is-open .detail {
  max-height: 360px;
  opacity: 1;
  padding: 0 18px 18px;
  border-top-width: 1px;
}

.detail-inner {
  padding-top: 16px;
  display: grid;
  gap: 10px;
}

.detail p {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin: 0;
  color: var(--text);
  line-height: 1.7;
  font-size: 0.97rem;
}

.detail .label {
  flex-shrink: 0;
  min-width: 72px;
  padding: 5px 8px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--primary-dark);
  font-size: 0.74rem;
  font-weight: 700;
  text-align: center;
}

[hidden] { display: none !important; }

@media (max-width: 640px) {
  body {
    padding: 18px 12px 36px;
  }

  .hero {
    padding: 22px 16px 14px;
  }

  .toolbar {
    grid-template-columns: 1fr;
  }

  .company {
    border-radius: 28px;
  }

  .company button {
    padding: 16px 14px 14px;
    font-size: 1rem;
  }

  .detail {
    padding: 0 14px;
  }

  .company.is-open .detail {
    padding: 0 14px 14px;
  }

  .detail p {
    display: block;
  }

  .detail .label {
    display: inline-block;
    margin-bottom: 6px;
  }
}
</style>
</head>

const search = document.getElementById("search");
const industry = document.getElementById("industry");
const list = document.getElementById("list");
const count = document.getElementById("count");

function setCardState(card, detail, button, open) {
  card.classList.toggle("is-open", open);
  button.setAttribute("aria-expanded", String(open));
  button.querySelector(".chevron").textContent = open ? "－" : "＋";
  detail.style.maxHeight = open ? detail.scrollHeight + "px" : "0px";
  detail.style.opacity = open ? "1" : "0";
}

function showCompanies() {
  const keyword = search.value.trim().toLowerCase();
  const selected = industry.value;

  const filtered = companies.filter(company => {
    const text = (company.name + company.address + company.info).toLowerCase();
    return text.includes(keyword) && (!selected || company.industry === selected);
  });

  list.replaceChildren();
  count.innerHTML = '<strong>' + filtered.length + '</strong> 社の企業が見つかりました';

  filtered.forEach((company, index) => {
    const card = document.createElement("div");
    card.className = "company";

    const button = document.createElement("button");
    button.type = "button";
    button.setAttribute("aria-expanded", "false");
    button.innerHTML = '<span><span class="mark">' + (index + 1) + '</span>' + company.name + '</span><span class="chevron">＋</span>';

    detail.className = "detail";
    detail.hidden = false;

    inner.className = "detail-inner";

    const address = document.createElement("p");
    address.innerHTML = '<span class="label">所在地</span><span>' + company.address + '</span>';

    const type = document.createElement("p");
    type.innerHTML = '<span class="label">業種</span><span>' + company.industry + '</span>';

    const info = document.createElement("p");
    info.innerHTML = '<span class="label">情報</span><span>' + company.info + '</span>';

    inner.append(address, type, info);
    detail.append(inner);

    button.addEventListener("click", () => {
      const isOpen = card.classList.contains("is-open");
      setCardState(card, detail, button, !isOpen);
    });

    card.append(button, detail);
    list.append(card);
    setCardState(card, detail, button, false);
  });
}

search.addEventListener("input", showCompanies);
industry.addEventListener("change", showCompanies);

showCompanies();
</script>
</body>
</html>
